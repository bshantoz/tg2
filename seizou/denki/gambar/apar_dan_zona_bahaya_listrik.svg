<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="300" fill="#EEF3FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#16324A">Kode Warna Kabel &amp; Keselamatan Listrik</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7A96">電源端子の色分け（R-S-T）と安全表示</text>

  <!-- Terminal block card -->
  <g transform="translate(30,84)">
    <rect width="290" height="192" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="145" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">Terminal Daya 3 Fase</text>
    <text x="145" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">R-S-T 端子の色分け</text>

    <rect x="40" y="60" width="210" height="46" rx="6" fill="#0E3E73"/>
    <circle cx="70" cy="83" r="8" fill="#FFFFFF"/>
    <circle cx="145" cy="83" r="8" fill="#FFFFFF"/>
    <circle cx="220" cy="83" r="8" fill="#FFFFFF"/>

    <line x1="70" y1="106" x2="70" y2="140" stroke="#D6362B" stroke-width="6" stroke-linecap="round"/>
    <line x1="145" y1="106" x2="145" y2="140" stroke="#E8E8E8" stroke-width="6" stroke-linecap="round"/>
    <rect x="141" y="106" width="8" height="34" fill="none" stroke="#1A56A8" stroke-width="1"/>
    <line x1="220" y1="106" x2="220" y2="140" stroke="#16324A" stroke-width="6" stroke-linecap="round"/>

    <text x="70" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#16324A">R</text>
    <text x="145" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#16324A">S</text>
    <text x="220" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#16324A">T</text>
    <text x="70" y="172" text-anchor="middle" font-size="9" fill="#5C7A96">merah</text>
    <text x="145" y="172" text-anchor="middle" font-size="9" fill="#5C7A96">putih</text>
    <text x="220" y="172" text-anchor="middle" font-size="9" fill="#5C7A96">hitam</text>
  </g>

  <!-- APAR card -->
  <g transform="translate(340,84)">
    <rect width="215" height="192" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="107" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">APAR</text>
    <text x="107" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#28040;&#54542;&#22120;</text>
    <g transform="translate(85,58)" stroke="#0E3E73" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="20" width="36" height="70" rx="14" fill="#0E3E73"/>
      <rect x="10" y="4" width="16" height="18" rx="3"/>
      <line x1="18" y1="4" x2="18" y2="-8"/>
      <path d="M2 18 L-14 6" />
      <path d="M-22 -2 L-14 6 L-22 12" fill="none"/>
      <line x1="18" y1="22" x2="18" y2="40" stroke="#FFFFFF" stroke-width="2.4"/>
    </g>
    <text x="107" y="164" text-anchor="middle" font-size="9.5" fill="#5C7A96">Alat pemadam api ringan</text>
    <text x="107" y="178" text-anchor="middle" font-size="9.5" fill="#5C7A96">letakkan dekat panel listrik</text>
  </g>

  <!-- Danger zone card -->
  <g transform="translate(575,84)">
    <rect width="195" height="192" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="97" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">Zona Bahaya</text>
    <text x="97" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#24863;&#38651;&#27963;&#21361;&#38626;</text>
    <polygon points="97,58 132,120 62,120" fill="none" stroke="#0E3E73" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="102,72 88,100 100,100 92,116" fill="none" stroke="#0E3E73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="97" y="164" text-anchor="middle" font-size="9.5" fill="#5C7A96">Bahaya sengatan listrik</text>
    <text x="97" y="178" text-anchor="middle" font-size="9.5" fill="#5C7A96">wajib LOTO sebelum kerja</text>
  </g>
</svg>
