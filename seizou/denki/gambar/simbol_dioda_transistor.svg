<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="300" fill="#EEF3FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#16324A">Simbol Dioda &amp; Transistor</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7A96">ダイオードとトランジスタ（NPN・PNP）の図記号</text>

  <!-- Diode card -->
  <g transform="translate(30,82)">
    <rect width="230" height="188" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="115" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#16324A">Dioda</text>
    <text x="115" y="42" text-anchor="middle" font-size="10.5" fill="#5C7A96">&#12480;&#12452;&#12458;&#12540;&#12489;</text>

    <line x1="30" y1="115" x2="80" y2="115" stroke="#1A56A8" stroke-width="3"/>
    <polygon points="80,95 80,135 125,115" fill="#0E3E73"/>
    <line x1="125" y1="95" x2="125" y2="135" stroke="#1A56A8" stroke-width="4"/>
    <line x1="125" y1="115" x2="200" y2="115" stroke="#1A56A8" stroke-width="3"/>

    <text x="55" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16324A">Anoda</text>
    <text x="175" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16324A">Katoda</text>
    <text x="115" y="160" text-anchor="middle" font-size="10" fill="#5C7A96">Arus mengalir A &#8594; K</text>
    <text x="115" y="174" text-anchor="middle" font-size="10" fill="#5C7A96">(forward bias)</text>
  </g>

  <!-- NPN card -->
  <g transform="translate(285,82)">
    <rect width="230" height="188" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="115" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#16324A">Transistor NPN</text>

    <line x1="60" y1="70" x2="60" y2="150" stroke="#1A56A8" stroke-width="4"/>
    <line x1="30" y1="110" x2="60" y2="110" stroke="#1A56A8" stroke-width="3"/>
    <line x1="60" y1="88" x2="110" y2="70" stroke="#1A56A8" stroke-width="3"/>
    <line x1="60" y1="132" x2="110" y2="150" stroke="#1A56A8" stroke-width="3"/>
    <line x1="110" y1="70" x2="110" y2="45" stroke="#1A56A8" stroke-width="3"/>
    <line x1="110" y1="150" x2="110" y2="175" stroke="#1A56A8" stroke-width="3"/>
    <!-- arrow on emitter pointing out (NPN) -->
    <polygon points="95,142 110,150 100,128" fill="#0E3E73"/>

    <text x="18" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#16324A">B</text>
    <text x="120" y="46" font-size="10" font-weight="700" fill="#16324A">C</text>
    <text x="120" y="182" font-size="10" font-weight="700" fill="#16324A">E</text>
    <text x="115" y="205" text-anchor="middle" font-size="9.5" fill="#5C7A96">Basis / Kolektor / Emitor</text>
    <text x="115" y="220" text-anchor="middle" font-size="9.5" fill="#5C7A96">panah keluar dari emitor</text>
  </g>

  <!-- PNP card -->
  <g transform="translate(540,82)">
    <rect width="230" height="188" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="115" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#16324A">Transistor PNP</text>

    <line x1="60" y1="70" x2="60" y2="150" stroke="#1A56A8" stroke-width="4"/>
    <line x1="30" y1="110" x2="60" y2="110" stroke="#1A56A8" stroke-width="3"/>
    <line x1="60" y1="88" x2="110" y2="70" stroke="#1A56A8" stroke-width="3"/>
    <line x1="60" y1="132" x2="110" y2="150" stroke="#1A56A8" stroke-width="3"/>
    <line x1="110" y1="70" x2="110" y2="45" stroke="#1A56A8" stroke-width="3"/>
    <line x1="110" y1="150" x2="110" y2="175" stroke="#1A56A8" stroke-width="3"/>
    <!-- arrow on emitter pointing in (PNP) -->
    <polygon points="60,110 82,120 72,98" fill="#0E3E73"/>

    <text x="18" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#16324A">B</text>
    <text x="120" y="46" font-size="10" font-weight="700" fill="#16324A">C</text>
    <text x="120" y="182" font-size="10" font-weight="700" fill="#16324A">E</text>
    <text x="115" y="205" text-anchor="middle" font-size="9.5" fill="#5C7A96">Basis / Kolektor / Emitor</text>
    <text x="115" y="220" text-anchor="middle" font-size="9.5" fill="#5C7A96">panah masuk ke basis</text>
  </g>
</svg>
