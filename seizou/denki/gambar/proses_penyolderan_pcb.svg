<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="320" fill="#EEF3FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#16324A">Proses Penyolderan Komponen pada PCB</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7A96">はんだ付けの手順（プリント配線板）</text>

  <!-- Main illustration card -->
  <g transform="translate(40,80)">
    <rect width="720" height="120" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <!-- PCB board -->
    <rect x="40" y="30" width="420" height="60" rx="4" fill="#EEF3FA" stroke="#1A56A8" stroke-width="2"/>
    <!-- copper pads -->
    <circle cx="150" cy="60" r="9" fill="none" stroke="#1A56A8" stroke-width="2"/>
    <circle cx="190" cy="60" r="9" fill="none" stroke="#1A56A8" stroke-width="2"/>
    <!-- component body (resistor) sitting on pads -->
    <rect x="140" y="50" width="60" height="20" rx="10" fill="#0E3E73"/>
    <line x1="130" y1="60" x2="140" y2="60" stroke="#1A56A8" stroke-width="2.5"/>
    <line x1="200" y1="60" x2="210" y2="60" stroke="#1A56A8" stroke-width="2.5"/>
    <!-- solder joint blob -->
    <circle cx="150" cy="60" r="5" fill="#1A56A8"/>
    <circle cx="190" cy="60" r="5" fill="#1A56A8"/>

    <!-- soldering iron tip touching the joint -->
    <g transform="translate(230,-6) rotate(28)">
      <rect x="0" y="0" width="130" height="10" rx="4" fill="#5C7A96"/>
      <polygon points="130,-1 150,5 130,11" fill="#0E3E73"/>
    </g>
    <!-- solder wire feeding in -->
    <line x1="210" y1="20" x2="180" y2="55" stroke="#1A56A8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="180" cy="55" r="3" fill="#1A56A8"/>

    <!-- heat glow -->
    <circle cx="190" cy="60" r="14" fill="#1A56A8" opacity="0.18"/>

    <text x="250" y="112" text-anchor="middle" font-size="10.5" fill="#5C7A96">Ujung besi solder 300&#8211;400&#176;C menyentuh pad &amp; kaki komponen</text>

    <!-- text info right side -->
    <g transform="translate(500,20)">
      <text x="0" y="0" font-size="12.5" font-weight="700" fill="#16324A">Sambungan solder yang baik:</text>
      <text x="0" y="20" font-size="10.5" fill="#5C7A96">&#8226; Mengkilap, halus, seperti kerucut kecil</text>
      <text x="0" y="38" font-size="10.5" fill="#5C7A96">&#8226; Bukan 芋はんだ (cold joint) &#8212; kusam/kasar</text>
      <text x="0" y="56" font-size="10.5" fill="#5C7A96">&#8226; Waktu kontak singkat &#8776; 2&#8211;3 detik</text>
    </g>
  </g>

  <!-- 3 step callouts -->
  <g font-size="10.5">
    <g transform="translate(60,220)">
      <circle cx="18" cy="18" r="18" fill="#0E3E73"/>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <rect x="44" y="0" width="180" height="60" rx="10" fill="#FFFFFF" stroke="#1A56A8" stroke-width="2"/>
      <text x="60" y="24" font-size="11.5" font-weight="700" fill="#16324A">Panaskan</text>
      <text x="60" y="40" font-size="9.5" fill="#5C7A96">Tempel ujung besi solder</text>
      <text x="60" y="52" font-size="9.5" fill="#5C7A96">ke pad &amp; kaki komponen</text>
    </g>
    <g transform="translate(310,220)">
      <circle cx="18" cy="18" r="18" fill="#0E3E73"/>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <rect x="44" y="0" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#1A56A8" stroke-width="2"/>
      <text x="60" y="24" font-size="11.5" font-weight="700" fill="#16324A">Beri timah solder</text>
      <text x="60" y="40" font-size="9.5" fill="#5C7A96">Sentuhkan kawat timah ke</text>
      <text x="60" y="52" font-size="9.5" fill="#5C7A96">titik sambungan yang panas</text>
    </g>
    <g transform="translate(580,220)">
      <circle cx="18" cy="18" r="18" fill="#0E3E73"/>
      <text x="18" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
      <rect x="44" y="0" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#1A56A8" stroke-width="2"/>
      <text x="60" y="24" font-size="11.5" font-weight="700" fill="#16324A">Angkat</text>
      <text x="60" y="40" font-size="9.5" fill="#5C7A96">Angkat timah, lalu</text>
      <text x="60" y="52" font-size="9.5" fill="#5C7A96">besi solder</text>
    </g>
  </g>
</svg>
