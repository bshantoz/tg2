<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="300" fill="#EEF3FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#16324A">Alat Ukur Presisi &amp; Alat Ukur Listrik</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7A96">マイクロメータ・ノギス・テスター</text>

  <!-- Mikrometer -->
  <g transform="translate(30,84)">
    <rect width="236" height="194" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="118" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">Mikrometer</text>
    <text x="118" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#22806;&#20605;&#12510;&#12452;&#12463;&#12525;&#12513;&#12540;&#12479;</text>
    <g stroke="#1A56A8" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M30,60 A70,70 0 1 1 30,180" />
      <line x1="30" y1="60" x2="150" y2="60"/>
      <line x1="150" y1="60" x2="150" y2="100"/>
      <line x1="150" y1="100" x2="190" y2="100"/>
      <line x1="190" y1="90" x2="190" y2="110"/>
      <line x1="196" y1="100" x2="220" y2="100"/>
      <rect x="196" y="86" width="30" height="28" rx="3" fill="#FFFFFF" stroke="#1A56A8" stroke-width="2"/>
    </g>
    <text x="118" y="164" text-anchor="middle" font-size="9.5" fill="#5C7A96">Toleransi &#177;0.01mm</text>
    <text x="118" y="178" text-anchor="middle" font-size="9.5" fill="#5C7A96">skala tetap + thimble</text>
  </g>

  <!-- Jangka sorong -->
  <g transform="translate(282,84)">
    <rect width="236" height="194" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="118" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">Jangka Sorong</text>
    <text x="118" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#12494;&#12462;&#12473;（&#12496;&#12540;&#12491;&#12450;&#12461;&#12515;&#12522;&#12497;&#12540;&#12472;）</text>
    <g stroke="#1A56A8" stroke-width="2.6" fill="none" stroke-linecap="round">
      <line x1="28" y1="70" x2="198" y2="70"/>
      <line x1="28" y1="70" x2="28" y2="50"/>
      <line x1="28" y1="70" x2="44" y2="100"/>
      <line x1="150" y1="70" x2="150" y2="50"/>
      <line x1="150" y1="70" x2="134" y2="100"/>
      <rect x="150" y="76" width="48" height="30" rx="2" fill="#FFFFFF" stroke="#1A56A8" stroke-width="2"/>
      <line x1="160" y1="106" x2="160" y2="130"/>
    </g>
    <line x1="30" y1="110" x2="198" y2="110" stroke="#1A56A8" stroke-width="1.2"/>
    <text x="118" y="164" text-anchor="middle" font-size="9.5" fill="#5C7A96">Ukur luar/dalam/kedalaman</text>
    <text x="118" y="178" text-anchor="middle" font-size="9.5" fill="#5C7A96">presisi menengah</text>
  </g>

  <!-- Multitester -->
  <g transform="translate(534,84)">
    <rect width="236" height="194" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="118" y="26" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324A">Multitester</text>
    <text x="118" y="41" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#12486;&#12473;&#12479;&#12540;（&#12510;&#12523;&#12481;&#12513;&#12540;&#12479;）</text>
    <g stroke="#1A56A8" stroke-width="2.4" fill="none">
      <rect x="60" y="55" width="116" height="90" rx="8" fill="#FFFFFF"/>
      <rect x="72" y="65" width="92" height="30" rx="3"/>
      <text x="118" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1A56A8" stroke="none">12.0V</text>
      <circle cx="118" cy="122" r="12" fill="none"/>
      <line x1="90" y1="145" x2="90" y2="160" stroke-linecap="round"/>
      <line x1="146" y1="145" x2="146" y2="160" stroke-linecap="round"/>
    </g>
    <circle cx="90" cy="164" r="4" fill="#1A56A8"/>
    <circle cx="146" cy="164" r="4" fill="#1A56A8"/>
    <text x="118" y="164" text-anchor="middle" font-size="0" fill="none"></text>
    <text x="118" y="176" text-anchor="middle" font-size="9.5" fill="#5C7A96">V / A / &#937; / kontinuitas</text>
  </g>
</svg>
