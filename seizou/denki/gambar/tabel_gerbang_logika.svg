  <!-- NAND -->
  <g transform="translate(588,84)">
    <rect width="182" height="290" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
    <text x="91" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#16324A">NAND</text>
    <text x="91" y="41" text-anchor="middle" font-size="10" fill="#5C7A96">否定論理積</text>
