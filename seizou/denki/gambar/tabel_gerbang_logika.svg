      <line x1="0" y1="20" x2="100" y2="20" stroke="#1A56A8" stroke-width="1"/>
      <line x1="50" y1="0" x2="50" y2="46" stroke="#1A56A8" stroke-width="1"/>
      <line x1="0" y1="33" x2="100" y2="33" stroke="#1A56A8" stroke-width="0.6"/>
      <text x="25" y="14" text-anchor="middle" font-weight="700">X</text>
