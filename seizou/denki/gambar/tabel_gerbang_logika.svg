    <text x="16" y="64" font-size="9.5" fill="#5C7A96">X</text>
    <text x="16" y="102" font-size="9.5" fill="#5C7A96">Y</text>
    <g transform="translate(23,132)" font-size="9.5" fill="#16324A">
      <rect width="136" height="86" fill="none" stroke="#1A56A8" stroke-width="1.2"/>
      <line x1="0" y1="20" x2="136" y2="20" stroke="#1A56A8" stroke-width="1"/>
      <line x1="45" y1="0" x2="45" y2="86" stroke="#1A56A8" stroke-width="1"/>
      <line x1="90" y1="0" x2="90" y2="86" stroke="#1A56A8" stroke-width="1"/>
      <line x1="0" y1="36" x2="136" y2="36" stroke="#1A56A8" stroke-width="0.6"/>
      <line x1="0" y1="52" x2="136" y2="52" stroke="#1A56A8" stroke-width="0.6"/>
      <line x1="0" y1="68" x2="136" y2="68" stroke="#1A56A8" stroke-width="0.6"/>
      <text x="22" y="14" text-anchor="middle" font-weight="700">X</text>
      <text x="67" y="14" text-anchor="middle" font-weight="700">Y</text>
      <text x="112" y="14" text-anchor="middle" font-weight="700">Out</text>
      <text x="22" y="32" text-anchor="middle">0</text><text x="67" y="32" text-anchor="middle">0</text><text x="112" y="32" text-anchor="middle">1</text>
      <text x="22" y="48" text-anchor="middle">0</text><text x="67" y="48" text-anchor="middle">1</text><text x="112" y="48" text-anchor="middle">1</text>
      <text x="22" y="64" text-anchor="middle">1</text><text x="67" y="64" text-anchor="middle">0</text><text x="112" y="64" text-anchor="middle">1</text>
      <text x="22" y="80" text-anchor="middle">1</text><text x="67" y="80" text-anchor="middle">1</text><text x="112" y="80" text-anchor="middle">0</text>
    </g>
