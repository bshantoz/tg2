<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="800" height="300" fill="#EEF3FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#16324A">Alur Pengemasan Industri Komponen Elektronik</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7A96">工業包装の流れ（静電気防止包装）</text>

  <defs>
    <marker id="apk" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1A56A8"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#16324A">
    <!-- Step 1 -->
    <g transform="translate(30,95)">
      <rect width="160" height="150" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
      <circle cx="80" cy="34" r="18" fill="#0E3E73"/>
      <rect x="68" y="24" width="24" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <path d="M68 30 l-6 -4 M92 30 l6 -4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="70" text-anchor="middle" font-weight="700" font-size="11.5">Kemasan</text>
      <text x="80" y="86" text-anchor="middle" font-weight="700" font-size="11.5">Anti-statis</text>
      <text x="80" y="104" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#38745;&#38651;&#27668;&#38450;&#27490;&#21253;&#35013;</text>
      <text x="80" y="122" text-anchor="middle" font-size="8.5" fill="#5C7A96">PCB dibungkus</text>
      <text x="80" y="134" text-anchor="middle" font-size="8.5" fill="#5C7A96">kantong/busa ESD</text>
    </g>
    <line x1="190" y1="170" x2="204" y2="170" stroke="#1A56A8" stroke-width="3" marker-end="url(#apk)"/>

    <!-- Step 2 -->
    <g transform="translate(204,95)">
      <rect width="160" height="150" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
      <circle cx="80" cy="34" r="18" fill="#0E3E73"/>
      <rect x="66" y="26" width="28" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="66" y1="32" x2="94" y2="32" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="80" y="70" text-anchor="middle" font-weight="700" font-size="11.5">Label Lot</text>
      <text x="80" y="86" text-anchor="middle" font-weight="700" font-size="11.5">&amp; Tanggal</text>
      <text x="80" y="104" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#12525;&#12483;&#12488;&#30058;&#21495;</text>
      <text x="80" y="122" text-anchor="middle" font-size="8.5" fill="#5C7A96">untuk traceability</text>
      <text x="80" y="134" text-anchor="middle" font-size="8.5" fill="#5C7A96">bila ada klaim mutu</text>
    </g>
    <line x1="364" y1="170" x2="378" y2="170" stroke="#1A56A8" stroke-width="3" marker-end="url(#apk)"/>

    <!-- Step 3 -->
    <g transform="translate(378,95)">
      <rect width="160" height="150" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
      <circle cx="80" cy="34" r="18" fill="#0E3E73"/>
      <path d="M70 34 l7 7 l15 -17" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="70" text-anchor="middle" font-weight="700" font-size="11.5">Pengecekan</text>
      <text x="80" y="86" text-anchor="middle" font-weight="700" font-size="11.5">Akhir</text>
      <text x="80" y="104" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#26368;&#32066;&#30906;&#35469;</text>
      <text x="80" y="122" text-anchor="middle" font-size="8.5" fill="#5C7A96">produk gagal &#8594;</text>
      <text x="80" y="134" text-anchor="middle" font-size="8.5" fill="#5C7A96">karantina (&#38548;&#38626;)</text>
    </g>
    <line x1="538" y1="170" x2="552" y2="170" stroke="#1A56A8" stroke-width="3" marker-end="url(#apk)"/>

    <!-- Step 4 -->
    <g transform="translate(552,95)">
      <rect width="160" height="150" rx="14" fill="#FFFFFF" stroke="#1A56A8" stroke-width="3"/>
      <circle cx="80" cy="34" r="18" fill="#0E3E73"/>
      <rect x="64" y="24" width="32" height="16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M96 26 h8 l4 6 v4 h-12 z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="72" cy="40" r="2.4" fill="#FFFFFF"/>
      <circle cx="92" cy="40" r="2.4" fill="#FFFFFF"/>
      <text x="80" y="70" text-anchor="middle" font-weight="700" font-size="11.5">Palet &amp;</text>
      <text x="80" y="86" text-anchor="middle" font-weight="700" font-size="11.5">Pengiriman</text>
      <text x="80" y="104" text-anchor="middle" font-size="9.5" fill="#5C7A96">&#20986;&#33655;</text>
      <text x="80" y="122" text-anchor="middle" font-size="8.5" fill="#5C7A96">disusun di palet,</text>
      <text x="80" y="134" text-anchor="middle" font-size="8.5" fill="#5C7A96">dikirim ke pelanggan</text>
    </g>
  </g>
</svg>
