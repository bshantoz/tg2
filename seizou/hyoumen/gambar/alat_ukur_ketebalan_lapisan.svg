<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" fill="#F5F2FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2438">Pengukuran Ketebalan Lapisan (膜厚計)</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6E8C">コーティング膜厚ゲージによる非破壊測定</text>

  <!-- metal plate with coating, side view -->
  <g transform="translate(120,140)">
    <rect x="0" y="60" width="320" height="60" fill="#7A6E8C"/>
    <rect x="0" y="50" width="320" height="10" fill="#6A3FA0"/>
    <text x="160" y="100" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">logam dasar</text>
    <text x="160" y="38" text-anchor="middle" font-size="9" fill="#4E2C7A">lapisan (めっき/塗膜)</text>
  </g>

  <!-- thickness gauge probe touching surface -->
  <g transform="translate(230,20)">
    <rect x="0" y="0" width="60" height="110" rx="10" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <rect x="8" y="10" width="44" height="34" rx="4" fill="#4E2C7A"/>
    <text x="30" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">8.2</text>
    <text x="30" y="38" text-anchor="middle" font-size="7" fill="#E4DBF0">μm</text>
    <circle cx="30" cy="56" r="7" fill="none" stroke="#6A3FA0" stroke-width="2"/>
    <circle cx="30" cy="56" r="2" fill="#6A3FA0"/>
    <rect x="22" y="100" width="16" height="70" fill="#6A3FA0"/>
    <circle cx="30" cy="174" r="7" fill="#4E2C7A"/>
  </g>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#2E2438">膜厚 = 質量 ÷（面積 × 密度）— pengukuran tanpa merusak produk</text>

  <!-- side annotation callout -->
  <g transform="translate(480,90)">
    <rect width="280" height="200" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="140" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#2E2438">膜厚計</text>
    <text x="140" y="46" text-anchor="middle" font-size="9" fill="#7A6E8C">Coating Thickness Gauge</text>
    <line x1="20" y1="58" x2="260" y2="58" stroke="#E4DBF0" stroke-width="2"/>
    <text x="30" y="80" font-size="10" fill="#2E2438">• Prinsip elektromagnetik /</text>
    <text x="30" y="94" font-size="10" fill="#2E2438">  eddy-current</text>
    <text x="30" y="118" font-size="10" fill="#2E2438">• Non-destruktif (tidak</text>
    <text x="30" y="132" font-size="10" fill="#2E2438">  merusak produk)</text>
    <text x="30" y="156" font-size="10" fill="#2E2438">• Hasil dalam satuan μm</text>
    <text x="30" y="180" font-size="10" fill="#6A3FA0" font-weight="700">Rumus: tebal = massa ÷</text>
    <text x="30" y="194" font-size="10" fill="#6A3FA0" font-weight="700">(luas × densitas)</text>
  </g>
</svg>
