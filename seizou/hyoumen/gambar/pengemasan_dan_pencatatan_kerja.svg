<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F5F2FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2438">Alur Pengemasan Produk Logam Berlapis</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6E8C">工業包装の流れとロット番号による作業記録</text>

  <defs>
    <marker id="ap2" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6A3FA0"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#2E2438">
    <!-- Step 1: VCI paper -->
    <g transform="translate(24,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
      <circle cx="82" cy="32" r="18" fill="#4E2C7A"/>
      <rect x="70" y="20" width="24" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="82" y="66" text-anchor="middle" font-weight="700" font-size="10.5">Kertas Anti-Karat</text>
      <text x="82" y="82" text-anchor="middle" font-size="9.5" fill="#7A6E8C">錆止め紙 (VCI paper)</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.5" fill="#7A6E8C">Membungkus komponen</text>
      <text x="82" y="115" text-anchor="middle" font-size="8.5" fill="#7A6E8C">agar tidak berkarat</text>
    </g>
    <line x1="188" y1="160" x2="204" y2="160" stroke="#6A3FA0" stroke-width="3" marker-end="url(#ap2)"/>

    <!-- Step 2: cushioning -->
    <g transform="translate(206,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
      <circle cx="82" cy="32" r="18" fill="#4E2C7A"/>
      <path d="M70 40 q3 -18 12 -18 q3 -8 10 -2 q7 -5 10 6 q6 -1 6 7 q0 4 -4 4 h-30 q-4 0 -4 -4" fill="#FFFFFF"/>
      <text x="82" y="66" text-anchor="middle" font-weight="700" font-size="10.5">Bahan Bantalan</text>
      <text x="82" y="82" text-anchor="middle" font-size="9.5" fill="#7A6E8C">緩衝材 (cushioning)</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.5" fill="#7A6E8C">Mencegah goresan</text>
      <text x="82" y="115" text-anchor="middle" font-size="8.5" fill="#7A6E8C">permukaan mengkilap</text>
    </g>
    <line x1="370" y1="160" x2="386" y2="160" stroke="#6A3FA0" stroke-width="3" marker-end="url(#ap2)"/>

    <!-- Step 3: lot label -->
    <g transform="translate(388,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
      <circle cx="82" cy="32" r="18" fill="#4E2C7A"/>
      <rect x="68" y="22" width="28" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="72" y1="28" x2="92" y2="28" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="72" y1="34" x2="88" y2="34" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="82" y="66" text-anchor="middle" font-weight="700" font-size="10.5">Label Nomor Lot</text>
      <text x="82" y="82" text-anchor="middle" font-size="9.5" fill="#7A6E8C">ロット番号</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.5" fill="#7A6E8C">Terhubung ke catatan</text>
      <text x="82" y="115" text-anchor="middle" font-size="8.5" fill="#7A6E8C">proses harian</text>
    </g>
    <line x1="552" y1="160" x2="568" y2="160" stroke="#6A3FA0" stroke-width="3" marker-end="url(#ap2)"/>

    <!-- Step 4: work log book -->
    <g transform="translate(570,95)">
      <rect width="200" height="130" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
      <circle cx="100" cy="32" r="18" fill="#4E2C7A"/>
      <rect x="88" y="20" width="24" height="26" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="92" y1="27" x2="108" y2="27" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="92" y1="33" x2="108" y2="33" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="92" y1="39" x2="104" y2="39" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="100" y="66" text-anchor="middle" font-weight="700" font-size="10.5">Buku Catatan Kerja</text>
      <text x="100" y="82" text-anchor="middle" font-size="9.5" fill="#7A6E8C">作業記録・報告</text>
      <text x="100" y="102" text-anchor="middle" font-size="8.5" fill="#7A6E8C">Suhu, waktu celup,</text>
      <text x="100" y="115" text-anchor="middle" font-size="8.5" fill="#7A6E8C">hasil uji, nama operator</text>
    </g>
  </g>

  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#2E2438">Nomor lot memungkinkan penelusuran &amp; penarikan produk secara tepat sasaran bila ditemukan masalah mutu</text>
</svg>
