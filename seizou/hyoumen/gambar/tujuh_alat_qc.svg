<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#F5F2FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2438">QC 7 Tools: 4 Alat Analisis Mutu Utama</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6E8C">QC七つ道具（パレート図・特性要因図・散布図・管理図）</text>

  <!-- Card 1: Pareto -->
  <g transform="translate(40,85)">
    <rect width="340" height="150" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#2E2438">パレート図</text>
    <text x="20" y="40" font-size="9" fill="#7A6E8C">Pareto Chart — 80/20, batang menurun + kumulatif</text>
    <g transform="translate(30,55)">
      <line x1="0" y1="85" x2="280" y2="85" stroke="#7A6E8C" stroke-width="1.5"/>
      <rect x="10" y="15" width="30" height="70" fill="#6A3FA0"/>
      <rect x="50" y="35" width="30" height="50" fill="#6A3FA0"/>
      <rect x="90" y="52" width="30" height="33" fill="#6A3FA0"/>
      <rect x="130" y="66" width="30" height="19" fill="#6A3FA0"/>
      <rect x="170" y="76" width="30" height="9" fill="#6A3FA0"/>
      <polyline points="25,15 65,8 105,4 145,1 185,0" fill="none" stroke="#4E2C7A" stroke-width="2.5"/>
      <circle cx="25" cy="15" r="3" fill="#4E2C7A"/>
      <circle cx="65" cy="8" r="3" fill="#4E2C7A"/>
      <circle cx="105" cy="4" r="3" fill="#4E2C7A"/>
      <circle cx="145" cy="1" r="3" fill="#4E2C7A"/>
      <circle cx="185" cy="0" r="3" fill="#4E2C7A"/>
    </g>
  </g>

  <!-- Card 2: Fishbone -->
  <g transform="translate(420,85)">
    <rect width="340" height="150" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#2E2438">特性要因図</text>
    <text x="20" y="40" font-size="9" fill="#7A6E8C">Fishbone Diagram — akar penyebab masalah</text>
    <g transform="translate(20,60)" stroke="#6A3FA0" stroke-width="2.5" fill="none">
      <line x1="0" y1="45" x2="260" y2="45"/>
      <path d="M40 45 l-20 -22 M70 45 l-20 -22 M100 45 l-20 -22"/>
      <path d="M40 45 l-20 22 M70 45 l-20 22 M100 45 l-20 22"/>
      <path d="M180 45 l20 -22 M210 45 l20 -22 M240 45 l20 -22"/>
      <path d="M180 45 l20 22 M210 45 l20 22 M240 45 l20 22"/>
      <path d="M260 45 l20 -12 l0 24 z" fill="#4E2C7A" stroke="none"/>
    </g>
    <rect x="290" y="95" width="46" height="18" rx="4" fill="#4E2C7A"/>
    <text x="313" y="108" text-anchor="middle" font-size="8" fill="#FFFFFF">問題</text>
  </g>

  <!-- Card 3: Scatter -->
  <g transform="translate(40,255)">
    <rect width="340" height="150" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#2E2438">散布図</text>
    <text x="20" y="40" font-size="9" fill="#7A6E8C">Scatter Diagram — korelasi dua variabel</text>
    <g transform="translate(30,55)">
      <line x1="0" y1="85" x2="280" y2="85" stroke="#7A6E8C" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="85" stroke="#7A6E8C" stroke-width="1.5"/>
      <g fill="#6A3FA0">
        <circle cx="30" cy="70" r="3.5"/><circle cx="55" cy="60" r="3.5"/><circle cx="80" cy="62" r="3.5"/>
        <circle cx="100" cy="50" r="3.5"/><circle cx="120" cy="45" r="3.5"/><circle cx="140" cy="40" r="3.5"/>
        <circle cx="160" cy="30" r="3.5"/><circle cx="185" cy="28" r="3.5"/><circle cx="205" cy="18" r="3.5"/>
        <circle cx="230" cy="15" r="3.5"/><circle cx="250" cy="8" r="3.5"/>
      </g>
    </g>
  </g>

  <!-- Card 4: Control chart -->
  <g transform="translate(420,255)">
    <rect width="340" height="150" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="20" y="24" font-size="13" font-weight="700" fill="#2E2438">管理図</text>
    <text x="20" y="40" font-size="9" fill="#7A6E8C">Control Chart — batas kendali atas &amp; bawah</text>
    <g transform="translate(30,55)">
      <line x1="0" y1="10" x2="280" y2="10" stroke="#4E2C7A" stroke-width="1.5" stroke-dasharray="4,3"/>
      <line x1="0" y1="45" x2="280" y2="45" stroke="#7A6E8C" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="0" y1="80" x2="280" y2="80" stroke="#4E2C7A" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="284" y="14" font-size="8" fill="#4E2C7A">UCL</text>
      <text x="284" y="49" font-size="8" fill="#7A6E8C">CL</text>
      <text x="284" y="84" font-size="8" fill="#4E2C7A">LCL</text>
      <polyline points="0,50 25,40 50,55 75,42 100,48 125,35 150,50 175,58 200,44 225,52 250,38 275,46" fill="none" stroke="#6A3FA0" stroke-width="2"/>
    </g>
  </g>
</svg>
