<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#F5F2FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2438">Geometri Silinder Berlubang (Tabung dengan Lubang)</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6E8C">中空円筒の表面積計算（外径・内径・高さ）</text>

  <!-- 3D-ish hollow cylinder -->
  <g transform="translate(180,110)">
    <!-- outer body -->
    <path d="M0,0 A110,32 0 0 1 220,0 L220,170 A110,32 0 0 1 0,170 Z" fill="#6A3FA0"/>
    <ellipse cx="110" cy="0" rx="110" ry="32" fill="#E4DBF0" stroke="#6A3FA0" stroke-width="3"/>
    <ellipse cx="110" cy="0" rx="46" ry="13.5" fill="#F5F2FA" stroke="#4E2C7A" stroke-width="3"/>
    <ellipse cx="110" cy="170" rx="110" ry="32" fill="none" stroke="#6A3FA0" stroke-width="3"/>
    <path d="M0,0 L0,170 M220,0 L220,170" stroke="#6A3FA0" stroke-width="3"/>

    <!-- outer radius annotation -->
    <line x1="110" y1="0" x2="220" y2="0" stroke="#2E2438" stroke-width="1.5"/>
    <text x="168" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2438">R (jari-jari luar)</text>
    <text x="168" y="16" text-anchor="middle" font-size="9" fill="#7A6E8C">contoh: R = 5cm</text>

    <!-- inner radius annotation -->
    <line x1="110" y1="0" x2="156" y2="0" stroke="#4E2C7A" stroke-width="1.5"/>
    <text x="105" y="-22" text-anchor="middle" font-size="11" font-weight="700" fill="#4E2C7A">r (jari-jari dalam)</text>
    <text x="105" y="-38" text-anchor="middle" font-size="9" fill="#7A6E8C">contoh: r = 2cm</text>

    <!-- height annotation -->
    <line x1="-30" y1="0" x2="-30" y2="170" stroke="#2E2438" stroke-width="1.5"/>
    <line x1="-36" y1="0" x2="-24" y2="0" stroke="#2E2438" stroke-width="1.5"/>
    <line x1="-36" y1="170" x2="-24" y2="170" stroke="#2E2438" stroke-width="1.5"/>
    <text x="-45" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2438" transform="rotate(-90,-45,90)">h (tinggi)</text>
    <text x="-64" y="90" text-anchor="middle" font-size="9" fill="#7A6E8C" transform="rotate(-90,-64,90)">contoh: h = 10cm</text>
  </g>

  <!-- formula card -->
  <g transform="translate(500,95)">
    <rect width="260" height="230" rx="14" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="130" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2438">Luas Permukaan Total</text>
    <text x="130" y="44" text-anchor="middle" font-size="8" fill="#7A6E8C">表面積 = 上下面 + 外側面 + 内側面</text>
    <line x1="20" y1="54" x2="240" y2="54" stroke="#E4DBF0" stroke-width="2"/>
    <text x="24" y="76" font-size="9.5" fill="#2E2438">Cincin atas+bawah:</text>
    <text x="24" y="90" font-size="9" fill="#7A6E8C">2×3.14×(R²−r²)</text>
    <text x="24" y="104" font-size="9" fill="#4E2C7A">= 2×3.14×(25−4) = 131.9 cm²</text>
    <text x="24" y="128" font-size="9.5" fill="#2E2438">Selimut luar:</text>
    <text x="24" y="142" font-size="9" fill="#7A6E8C">3.14×2×R×h</text>
    <text x="24" y="156" font-size="9" fill="#4E2C7A">= 3.14×2×5×10 = 314 cm²</text>
    <text x="24" y="180" font-size="9.5" fill="#2E2438">Selimut dalam:</text>
    <text x="24" y="194" font-size="9" fill="#7A6E8C">3.14×2×r×h</text>
    <text x="24" y="208" font-size="9" fill="#4E2C7A">= 3.14×2×2×10 = 125.6 cm²</text>
    <rect x="16" y="216" width="228" height="1" fill="#E4DBF0"/>
  </g>
  <rect x="500" y="330" width="260" height="34" rx="8" fill="#4E2C7A"/>
  <text x="630" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Total ≈ 571.5 cm²</text>
</svg>
