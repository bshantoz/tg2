<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#F5F2FA"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2438">Prinsip Dasar Proses Electroplating</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6E8C">電気めっきの原理（ワット浴：硫酸ニッケル・塩化ニッケル・ほう酸）</text>

  <!-- power source -->
  <g transform="translate(340,80)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="3"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2438">直流電源</text>
    <text x="60" y="38" text-anchor="middle" font-size="9" fill="#7A6E8C">DC power source</text>
    <text x="4" y="14" font-size="12" font-weight="700" fill="#6A3FA0">−</text>
    <text x="110" y="14" font-size="12" font-weight="700" fill="#6A3FA0">+</text>
  </g>

  <!-- wires -->
  <g stroke="#6A3FA0" stroke-width="3" fill="none">
    <line x1="352" y1="130" x2="352" y2="150"/>
    <line x1="352" y1="150" x2="255" y2="150"/>
    <line x1="255" y1="150" x2="255" y2="185"/>
    <line x1="468" y1="130" x2="468" y2="150"/>
    <line x1="468" y1="150" x2="545" y2="150"/>
    <line x1="545" y1="150" x2="545" y2="185"/>
  </g>
  <g fill="none" stroke="#6A3FA0" stroke-width="2">
    <path d="M300 145 l10 5 l-10 5" fill="none"/>
    <path d="M500 145 l-10 5 l10 5" fill="none"/>
  </g>
  <text x="255" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#2E2438">katoda（−）</text>
  <text x="545" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#2E2438">anoda（＋）</text>

  <!-- tank -->
  <rect x="160" y="185" width="480" height="150" rx="10" fill="#FFFFFF" stroke="#6A3FA0" stroke-width="4"/>
  <rect x="168" y="210" width="464" height="118" fill="#E4DBF0"/>
  <text x="400" y="325" text-anchor="middle" font-size="11" fill="#7A6E8C">電解液（めっき浴：硫酸ニッケル＋塩化ニッケル＋ほう酸）</text>

  <!-- cathode workpiece -->
  <rect x="235" y="220" width="40" height="80" rx="4" fill="#4E2C7A"/>
  <text x="255" y="215" text-anchor="middle" font-size="9" fill="#2E2438">被めっき物</text>

  <!-- anode metal plate -->
  <rect x="525" y="220" width="40" height="80" rx="4" fill="#6A3FA0"/>
  <text x="545" y="215" text-anchor="middle" font-size="9" fill="#2E2438">金属板（Ni）</text>

  <!-- ion flow arrows -->
  <g stroke="#4E2C7A" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M510 240 h-220"/>
    <path d="M510 270 h-220"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4E2C7A"/>
    </marker>
  </defs>
  <text x="400" y="230" text-anchor="middle" font-size="9" fill="#4E2C7A">Ni²⁺ mengendap di katoda</text>

  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#2E2438">Benda kerja = katoda, logam pelapis = anoda, arus DC melarutkan ion logam ke permukaan benda kerja</text>
</svg>
