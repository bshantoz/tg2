<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="340" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">Alat Ukur Presisi di Bengkel Logam</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">精密測定機器</text>

  <!-- 4 columns -->
  <!-- 1: Jangka sorong / nogisu -->
  <g transform="translate(30,90)">
    <rect width="176" height="210" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="88" cy="46" r="26" fill="#8C4008"/>
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M72 40 h32 v6 h-32 z"/>
      <path d="M72 40 v14 M104 40 v14"/>
      <path d="M76 54 v8 M100 54 v8"/>
    </g>
    <text x="88" y="94" text-anchor="middle" font-weight="700" font-size="12">Jangka Sorong</text>
    <text x="88" y="110" text-anchor="middle" font-size="10.5" fill="#6B6459">ノギス / nogisu</text>
    <line x1="16" y1="122" x2="160" y2="122" stroke="#F5F3EF" stroke-width="2"/>
    <text x="88" y="140" text-anchor="middle" font-size="9.5" fill="#2E2A26">本尺目盛 = skala utama</text>
    <text x="88" y="156" text-anchor="middle" font-size="9.5" fill="#2E2A26">副尺目盛 = skala nonius</text>
    <text x="88" y="176" text-anchor="middle" font-size="9" fill="#6B6459">Baca: skala utama +</text>
    <text x="88" y="190" text-anchor="middle" font-size="9" fill="#6B6459">garis nonius sejajar</text>
  </g>

  <!-- 2: Mikrometer -->
  <g transform="translate(216,90)">
    <rect width="176" height="210" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="88" cy="46" r="26" fill="#8C4008"/>
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M64 30 q-10 16 0 32"/>
      <rect x="72" y="40" width="10" height="12"/>
      <line x1="82" y1="46" x2="112" y2="46"/>
      <circle cx="116" cy="46" r="6"/>
    </g>
    <text x="88" y="94" text-anchor="middle" font-weight="700" font-size="12">Mikrometer</text>
    <text x="88" y="110" text-anchor="middle" font-size="10.5" fill="#6B6459">マイクロメータ</text>
    <line x1="16" y1="122" x2="160" y2="122" stroke="#F5F3EF" stroke-width="2"/>
    <text x="88" y="140" text-anchor="middle" font-size="9.5" fill="#2E2A26">Sifat wajib:</text>
    <text x="88" y="156" text-anchor="middle" font-size="9" fill="#6B6459">剛性 (kekakuan)</text>
    <text x="88" y="170" text-anchor="middle" font-size="9" fill="#6B6459">耐久性 (daya tahan)</text>
    <text x="88" y="184" text-anchor="middle" font-size="9" fill="#6B6459">耐食性 (tahan korosi)</text>
  </g>

  <!-- 3: V-block -->
  <g transform="translate(402,90)">
    <rect width="176" height="210" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="88" cy="46" r="26" fill="#8C4008"/>
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M72 56 h32 v-10 l-8 -14 h-16 l-8 14 z"/>
      <path d="M80 40 l8 10 l8 -10" />
      <circle cx="88" cy="32" r="4" fill="none"/>
    </g>
    <text x="88" y="94" text-anchor="middle" font-weight="700" font-size="12">V-Block</text>
    <text x="88" y="110" text-anchor="middle" font-size="10.5" fill="#6B6459">Vブロック</text>
    <line x1="16" y1="122" x2="160" y2="122" stroke="#F5F3EF" stroke-width="2"/>
    <text x="88" y="140" text-anchor="middle" font-size="9" fill="#2E2A26">Menahan benda kerja</text>
    <text x="88" y="154" text-anchor="middle" font-size="9" fill="#2E2A26">silindris (poros/pipa)</text>
    <text x="88" y="170" text-anchor="middle" font-size="9" fill="#6B6459">tetap stabil &amp; sejajar</text>
    <text x="88" y="184" text-anchor="middle" font-size="9" fill="#6B6459">saat diukur/ditandai</text>
  </g>

  <!-- 4: Magnet base -->
  <g transform="translate(588,90)">
    <rect width="176" height="210" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="88" cy="46" r="26" fill="#8C4008"/>
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
      <rect x="72" y="46" width="32" height="12" rx="2"/>
      <path d="M78 46 v-14 M98 46 v-14" />
      <circle cx="88" cy="28" r="9" fill="none"/>
    </g>
    <text x="88" y="94" text-anchor="middle" font-weight="700" font-size="12">Dudukan Magnet</text>
    <text x="88" y="110" text-anchor="middle" font-size="10.5" fill="#6B6459">マグネットベース</text>
    <line x1="16" y1="122" x2="160" y2="122" stroke="#F5F3EF" stroke-width="2"/>
    <text x="88" y="140" text-anchor="middle" font-size="9" fill="#2E2A26">Memasang dial gauge</text>
    <text x="88" y="154" text-anchor="middle" font-size="9" fill="#2E2A26">(jam ukur) pada</text>
    <text x="88" y="168" text-anchor="middle" font-size="9" fill="#6B6459">permukaan logam</text>
    <text x="88" y="184" text-anchor="middle" font-size="9" fill="#6B6459">secara magnetis</text>
  </g>

  <rect x="30" y="312" width="734" height="0" fill="none"/>
</svg>
