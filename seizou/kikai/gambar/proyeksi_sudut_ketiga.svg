<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">Proyeksi Sudut Ketiga (Third-Angle Projection)</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">第三角法</text>

  <!-- Isometric 3D object, left side -->
  <g transform="translate(90,120)">
    <text x="60" y="-30" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2A26">見取り図</text>
    <text x="60" y="-14" text-anchor="middle" font-size="9.5" fill="#6B6459">mitorizu (isometrik)</text>
    <!-- simple L-block isometric -->
    <g stroke="#B4530A" stroke-width="2" fill="#FFFFFF">
      <polygon points="0,60 50,30 100,60 50,90" fill="#F5DCC0"/>
      <polygon points="0,60 0,110 50,140 50,90" fill="#EBC9A0"/>
      <polygon points="50,90 50,140 100,110 100,60" fill="#DDB58C"/>
      <line x1="0" y1="60" x2="50" y2="30" stroke="#B4530A"/>
      <line x1="50" y1="30" x2="100" y2="60" stroke="#B4530A"/>
    </g>
    <path d="M110 90 h40" stroke="#8C4008" stroke-width="2.5" marker-end="url(#pp)" fill="none"/>
    <text x="130" y="82" text-anchor="middle" font-size="9" fill="#8C4008">arah lihat</text>
  </g>

  <defs>
    <marker id="pp" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8C4008"/>
    </marker>
  </defs>

  <!-- Third-angle layout: top view above, front view center, side view right -->
  <g transform="translate(340,100)">
    <!-- Top view (平面図) -->
    <rect x="60" y="0" width="110" height="60" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <line x1="60" y1="30" x2="170" y2="30" stroke="#6B6459" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="115" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2A26">平面図 (heimenzu)</text>
    <text x="115" y="90" text-anchor="middle" font-size="9.5" fill="#6B6459">Pandangan atas</text>

    <!-- Front view (正面図) - center, below top view -->
    <rect x="60" y="130" width="110" height="110" fill="#FFFFFF" stroke="#B4530A" stroke-width="3.5"/>
    <line x1="115" y1="130" x2="115" y2="240" stroke="#6B6459" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="115" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#2E2A26">正面図 (shōmenzu)</text>
    <text x="115" y="276" text-anchor="middle" font-size="10" fill="#6B6459">Pandangan depan (acuan utama)</text>

    <!-- alignment lines top-front -->
    <line x1="60" y1="60" x2="60" y2="130" stroke="#8C4008" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="170" y1="60" x2="170" y2="130" stroke="#8C4008" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Side view (側面図) - right of front view -->
    <rect x="230" y="130" width="80" height="110" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <line x1="230" y1="185" x2="310" y2="185" stroke="#6B6459" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="270" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#2E2A26">側面図</text>
    <text x="270" y="276" text-anchor="middle" font-size="9.5" fill="#6B6459">sokumenzu (samping)</text>

    <!-- alignment lines front-side -->
    <line x1="170" y1="140" x2="230" y2="140" stroke="#8C4008" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="170" y1="230" x2="230" y2="230" stroke="#8C4008" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- Legend for line types -->
  <g transform="translate(30,340)">
    <rect width="740" height="64" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2"/>
    <line x1="20" y1="22" x2="60" y2="22" stroke="#2E2A26" stroke-width="2.5"/>
    <text x="68" y="26" font-size="10.5" fill="#2E2A26">実線 (jissen) — tepi terlihat</text>
    <line x1="20" y1="44" x2="60" y2="44" stroke="#2E2A26" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="68" y="48" font-size="10.5" fill="#2E2A26">破線 (hasen) — tepi tersembunyi (隠れ線)</text>
    <line x1="420" y1="22" x2="460" y2="22" stroke="#2E2A26" stroke-width="1.5" stroke-dasharray="8 3 2 3"/>
    <text x="468" y="26" font-size="10.5" fill="#2E2A26">一点鎖線 (itten-sasen) — garis sumbu</text>
    <text x="420" y="48" font-size="10" fill="#B4530A" font-weight="700">Ingat: 平面図 di ATAS, 側面図 di KANAN 正面図</text>
  </g>
</svg>
