<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">QC 7 Tools &#8212; Alat Manajemen Mutu</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">QC七つ道具</text>

  <!-- Card 1: fishbone -->
  <g transform="translate(50,90)">
    <rect width="330" height="140" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#2E2A26">特性要因図</text>
    <text x="18" y="42" font-size="10" fill="#6B6459">tokusei yōinzu (fishbone)</text>
    <g transform="translate(20,60)" stroke="#8C4008" stroke-width="2" fill="none">
      <line x1="0" y1="50" x2="240" y2="50"/>
      <path d="M40 50 l-20 -22 M40 50 l-20 22"/>
      <path d="M100 50 l-20 -22 M100 50 l-20 22"/>
      <path d="M160 50 l-20 -22 M160 50 l-20 22"/>
      <path d="M240 50 l20 -14 l0 28 z" fill="#8C4008"/>
    </g>
    <text x="290" y="94" font-size="9" fill="#2E2A26">特性</text>
    <text x="130" y="118" text-anchor="middle" font-size="9" fill="#6B6459">要因 (4M) &#8592; 原因</text>
  </g>

  <!-- Card 2: pareto -->
  <g transform="translate(420,90)">
    <rect width="330" height="140" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#2E2A26">パレート図</text>
    <text x="18" y="42" font-size="10" fill="#6B6459">parēto zu (diagram Pareto)</text>
    <g transform="translate(30,58)">
      <rect x="0" y="30" width="30" height="50" fill="#B4530A"/>
      <rect x="40" y="42" width="30" height="38" fill="#B4530A"/>
      <rect x="80" y="54" width="30" height="26" fill="#B4530A"/>
      <rect x="120" y="64" width="30" height="16" fill="#B4530A"/>
      <rect x="160" y="72" width="30" height="8" fill="#B4530A"/>
      <polyline points="15,20 55,10 95,4 135,1 175,0" fill="none" stroke="#8C4008" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="15" cy="20" r="3" fill="#8C4008"/>
      <circle cx="175" cy="0" r="3" fill="#8C4008"/>
      <line x1="0" y1="80" x2="190" y2="80" stroke="#2E2A26" stroke-width="1.5"/>
    </g>
    <text x="165" y="130" text-anchor="middle" font-size="9" fill="#6B6459">Urutkan penyebab terbesar &#8594; terkecil</text>
  </g>

  <!-- Card 3: histogram -->
  <g transform="translate(50,250)">
    <rect width="330" height="140" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#2E2A26">ヒストグラム</text>
    <text x="18" y="42" font-size="10" fill="#6B6459">Histogram &#8212; sebaran data</text>
    <g transform="translate(40,55)">
      <rect x="0" y="55" width="22" height="25" fill="#8C4008"/>
      <rect x="26" y="35" width="22" height="45" fill="#8C4008"/>
      <rect x="52" y="15" width="22" height="65" fill="#8C4008"/>
      <rect x="78" y="30" width="22" height="50" fill="#8C4008"/>
      <rect x="104" y="50" width="22" height="30" fill="#8C4008"/>
      <rect x="130" y="65" width="22" height="15" fill="#8C4008"/>
      <line x1="0" y1="80" x2="152" y2="80" stroke="#2E2A26" stroke-width="1.5"/>
    </g>
    <text x="165" y="128" text-anchor="middle" font-size="9" fill="#6B6459">Distribusi/sebaran nilai data</text>
  </g>

  <!-- Card 4: control chart -->
  <g transform="translate(420,250)">
    <rect width="330" height="140" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#2E2A26">管理図</text>
    <text x="18" y="42" font-size="10" fill="#6B6459">kanri zu (control chart)</text>
    <g transform="translate(30,55)">
      <line x1="0" y1="15" x2="220" y2="15" stroke="#B4530A" stroke-width="1.5" stroke-dasharray="5 3"/>
      <line x1="0" y1="65" x2="220" y2="65" stroke="#B4530A" stroke-width="1.5" stroke-dasharray="5 3"/>
      <line x1="0" y1="40" x2="220" y2="40" stroke="#6B6459" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="224" y="18" font-size="8" fill="#B4530A">UCL</text>
      <text x="224" y="68" font-size="8" fill="#B4530A">LCL</text>
      <polyline points="0,42 25,30 50,48 75,36 100,44 125,28 150,38 175,50 200,32" fill="none" stroke="#8C4008" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#8C4008">
        <circle cx="0" cy="42" r="3"/><circle cx="25" cy="30" r="3"/><circle cx="50" cy="48" r="3"/>
        <circle cx="75" cy="36" r="3"/><circle cx="100" cy="44" r="3"/><circle cx="125" cy="28" r="3"/>
        <circle cx="150" cy="38" r="3"/><circle cx="175" cy="50" r="3"/><circle cx="200" cy="32" r="3"/>
      </g>
    </g>
    <text x="165" y="128" text-anchor="middle" font-size="9" fill="#6B6459">Batas kendali atas (UCL) / bawah (LCL)</text>
  </g>
</svg>
