<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">Alur Inspeksi Produk &amp; Penanganan Ketidaksesuaian</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">製品検査と不適合品の取扱い</text>

  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B4530A"/>
    </marker>
  </defs>

  <!-- Step 1: Produksi -->
  <g transform="translate(30,90)">
    <rect width="140" height="110" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="70" cy="30" r="18" fill="#8C4008"/>
    <rect x="60" y="22" width="20" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11">Produksi</text>
    <text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#6B6459">生産</text>
  </g>
  <line x1="170" y1="145" x2="196" y2="145" stroke="#B4530A" stroke-width="3" marker-end="url(#fa)"/>

  <!-- Step 2: Inspeksi visual/ukur -->
  <g transform="translate(198,90)">
    <rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#B4530A" stroke-width="3"/>
    <circle cx="75" cy="30" r="18" fill="#8C4008"/>
    <path d="M65 30 l8 8 l14 -16" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="60" text-anchor="middle" font-weight="700" font-size="10.5">Inspeksi Visual /</text>
    <text x="75" y="74" text-anchor="middle" font-weight="700" font-size="10.5">Ukur Dimensi</text>
    <text x="75" y="92" text-anchor="middle" font-size="9.5" fill="#6B6459">外観目視・計量検査</text>
  </g>

  <!-- Branch point -->
  <line x1="348" y1="145" x2="380" y2="145" stroke="#B4530A" stroke-width="3"/>
  <line x1="380" y1="145" x2="380" y2="80" stroke="#B4530A" stroke-width="3"/>
  <line x1="380" y1="145" x2="380" y2="230" stroke="#B4530A" stroke-width="3"/>
  <line x1="380" y1="80" x2="406" y2="80" stroke="#B4530A" stroke-width="3" marker-end="url(#fa)"/>
  <line x1="380" y1="230" x2="406" y2="230" stroke="#B4530A" stroke-width="3" marker-end="url(#fa)"/>
  <text x="388" y="112" font-size="10" fill="#2E2A26" font-weight="700">良品 (lolos)</text>
  <text x="388" y="262" font-size="10" fill="#2E2A26" font-weight="700">不適合品 (tidak lolos)</text>

  <!-- Pass branch: Kirim -->
  <g transform="translate(408,32)">
    <rect width="150" height="96" rx="14" fill="#FFFFFF" stroke="#8C4008" stroke-width="3"/>
    <circle cx="75" cy="28" r="16" fill="#8C4008"/>
    <path d="M60 28 h20 l6 8 v6 h-32 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="75" y="58" text-anchor="middle" font-weight="700" font-size="11">Kirim ke Pelanggan</text>
    <text x="75" y="76" text-anchor="middle" font-size="9.5" fill="#6B6459">出荷</text>
  </g>

  <!-- Fail branch: Karantina & Laporan -->
  <g transform="translate(408,182)">
    <rect width="360" height="110" rx="14" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
    <circle cx="42" cy="32" r="18" fill="#C0392B"/>
    <path d="M42 22 v14 M42 42 v2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="42" y="66" text-anchor="middle" font-weight="700" font-size="10.5">Karantina</text>
    <text x="42" y="82" text-anchor="middle" font-size="9.5" fill="#6B6459">不適合品エリア</text>

    <line x1="90" y1="55" x2="120" y2="55" stroke="#C0392B" stroke-width="2.5" marker-end="url(#fa)"/>

    <g transform="translate(122,10)">
      <rect width="220" height="90" rx="10" fill="#FCEEE8"/>
      <text x="14" y="24" font-size="10.5" font-weight="700" fill="#2E2A26">Beri label identifikasi jelas</text>
      <text x="14" y="42" font-size="10.5" fill="#2E2A26">Laporkan ke atasan / dept. mutu</text>
      <text x="14" y="60" font-size="10.5" fill="#2E2A26">Telusuri penyebab (原因調査)</text>
      <text x="14" y="78" font-size="10.5" fill="#2E2A26">Cek lot sebelum/sesudahnya</text>
    </g>
  </g>

  <!-- Bottom note -->
  <g transform="translate(30,320)">
    <rect width="740" height="56" rx="12" fill="#8C4008"/>
    <text x="370" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">不良率 = jumlah 不良品 &#247; jumlah total &#215; 100%</text>
    <text x="370" y="44" text-anchor="middle" font-size="10" fill="#F5DCC0">Contoh: 2 gagal dari 50 unit &#8594; 2 &#247; 50 &#215; 100% = 4.0%</text>
  </g>
</svg>
