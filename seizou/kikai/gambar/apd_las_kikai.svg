<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">APD Wajib untuk Pekerjaan Pengelasan</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">溶接作業の必須保護具</text>

  <defs>
    <marker id="apdArrow" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B4530A"/>
    </marker>
  </defs>

  <!-- Person silhouette, center -->
  <g transform="translate(340,90)">
    <!-- torso -->
    <path d="M60 150 q-4 -60 8 -78 q12 -14 32 -14 q20 0 32 14 q12 18 8 78 z" fill="#8C4008"/>
    <!-- head with welding face shield -->
    <circle cx="100" cy="40" r="30" fill="#8C4008"/>
    <!-- face shield rectangle -->
    <rect x="76" y="34" width="48" height="26" rx="4" fill="#2E2A26" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="83" y="40" width="34" height="12" rx="2" fill="#B4530A"/>
    <!-- helmet top -->
    <path d="M72 20 q28 -22 56 0 l-4 10 q-24 -16 -48 0 z" fill="#6B6459"/>
    <!-- arms -->
    <path d="M60 90 q-22 6 -30 30" stroke="#8C4008" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M140 90 q22 6 30 30" stroke="#8C4008" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- gloves -->
    <circle cx="27" cy="122" r="10" fill="#B4530A"/>
    <circle cx="173" cy="122" r="10" fill="#B4530A"/>
    <!-- legs -->
    <path d="M78 150 l-6 60 h16 l6 -60 z" fill="#6B6459"/>
    <path d="M122 150 l6 60 h-16 l-6 -60 z" fill="#6B6459"/>
  </g>

  <!-- Callout 1: face shield -->
  <line x1="378" y1="122" x2="150" y2="102" stroke="#B4530A" stroke-width="2" marker-end="url(#apdArrow)"/>
  <g transform="translate(20,80)">
    <rect width="200" height="66" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <circle cx="28" cy="33" r="16" fill="#8C4008"/>
    <path d="M18 26 h20 v14 h-20 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="18" y1="30" x2="38" y2="30" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="52" y="24" font-size="11.5" font-weight="700" fill="#2E2A26">溶接用保護面</text>
    <text x="52" y="40" font-size="10" fill="#6B6459">Pelindung wajah las</text>
    <text x="52" y="54" font-size="9.5" fill="#6B6459">Lindungi mata dari アーク光</text>
  </g>

  <!-- Callout 2: helmet -->
  <line x1="420" y1="70" x2="480" y2="30" stroke="#B4530A" stroke-width="2" marker-end="url(#apdArrow)"/>
  <g transform="translate(482,4)">
    <rect width="190" height="60" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="15" fill="#8C4008"/>
    <path d="M18 30 q9 -12 18 0 v4 h-18 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="16" y1="34" x2="38" y2="34" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="48" y="24" font-size="11.5" font-weight="700" fill="#2E2A26">保護帽</text>
    <text x="48" y="39" font-size="10" fill="#6B6459">Helm pelindung kepala</text>
  </g>

  <!-- Callout 3: earplugs -->
  <line x1="382" y1="88" x2="595" y2="140" stroke="#B4530A" stroke-width="2" marker-end="url(#apdArrow)"/>
  <g transform="translate(597,110)">
    <rect width="190" height="60" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="15" fill="#8C4008"/>
    <ellipse cx="27" cy="30" rx="7" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="48" y="24" font-size="11.5" font-weight="700" fill="#2E2A26">耳栓</text>
    <text x="48" y="39" font-size="10" fill="#6B6459">Penyumbat telinga</text>
  </g>

  <!-- Callout 4: dust mask -->
  <line x1="418" y1="118" x2="595" y2="230" stroke="#B4530A" stroke-width="2" marker-end="url(#apdArrow)"/>
  <g transform="translate(597,200)">
    <rect width="190" height="60" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <circle cx="27" cy="30" r="15" fill="#8C4008"/>
    <path d="M18 32 q9 8 18 0 q0 -10 -9 -10 q-9 0 -9 10 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="48" y="24" font-size="11.5" font-weight="700" fill="#2E2A26">防じんマスク</text>
    <text x="48" y="39" font-size="10" fill="#6B6459">Masker anti debu</text>
  </g>

  <!-- Callout 5: gloves -->
  <line x1="358" y1="212" x2="150" y2="240" stroke="#B4530A" stroke-width="2" marker-end="url(#apdArrow)"/>
  <g transform="translate(20,210)">
    <rect width="200" height="60" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2.5"/>
    <circle cx="28" cy="30" r="15" fill="#8C4008"/>
    <path d="M20 22 v10 q0 8 8 8 q8 0 8 -8 v-10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="52" y="24" font-size="11.5" font-weight="700" fill="#2E2A26">溶接用手袋</text>
    <text x="52" y="39" font-size="10" fill="#6B6459">Sarung tangan las</text>
  </g>

  <!-- Bottom note strip -->
  <rect x="20" y="340" width="760" height="60" rx="12" fill="#8C4008"/>
  <text x="400" y="364" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Aturan penting: 溶接用保護面 wajib dipakai saat las — bukan sekadar helm/masker/penyumbat telinga</text>
  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#F5DCC0">アーク光 (cahaya busur) dapat menyebabkan 電気性眼炎 jika mata tidak terlindungi</text>
</svg>
