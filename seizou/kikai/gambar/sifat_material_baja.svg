<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="340" fill="#F5F3EF"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2E2A26">Pengaruh Kadar Karbon pada Baja Karbon</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#6B6459">炭素鋼の炭素含有量と機械的性質</text>

  <!-- Chart area -->
  <g transform="translate(90,90)">
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#2E2A26" stroke-width="2"/>
    <line x1="0" y1="200" x2="560" y2="200" stroke="#2E2A26" stroke-width="2"/>
    <text x="-14" y="-8" font-size="11" fill="#2E2A26" font-weight="700">Nilai</text>
    <text x="560" y="224" text-anchor="end" font-size="11" fill="#2E2A26" font-weight="700">Kadar karbon (%) &#8594;</text>
    <text x="0" y="220" font-size="9.5" fill="#6B6459">rendah</text>
    <text x="560" y="220" text-anchor="end" font-size="9.5" fill="#6B6459">tinggi</text>

    <!-- gridlines -->
    <g stroke="#E0DAD0" stroke-width="1">
      <line x1="0" y1="50" x2="560" y2="50"/>
      <line x1="0" y1="100" x2="560" y2="100"/>
      <line x1="0" y1="150" x2="560" y2="150"/>
    </g>

    <!-- Kekuatan tarik (rising) -->
    <polyline points="0,170 140,130 280,95 420,60 560,20" fill="none" stroke="#B4530A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="560" cy="20" r="5" fill="#B4530A"/>
    <text x="480" y="10" font-size="11" font-weight="700" fill="#B4530A">引張強さ (naik)</text>
    <text x="480" y="-4" font-size="9.5" fill="#B4530A">hippari tsuyosa — kekuatan tarik</text>

    <!-- Keuletan / nobi (falling) -->
    <polyline points="0,20 140,55 280,95 420,140 560,180" fill="none" stroke="#8C4008" stroke-width="3.5" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="560" cy="180" r="5" fill="#8C4008"/>
    <text x="380" y="205" font-size="11" font-weight="700" fill="#8C4008">伸び (turun)</text>
    <text x="380" y="219" font-size="9.5" fill="#6B6459">nobi — perpanjangan/keuletan</text>
  </g>

  <!-- Note card -->
  <g transform="translate(40,272)">
    <rect width="720" height="56" rx="12" fill="#FFFFFF" stroke="#B4530A" stroke-width="2"/>
    <text x="360" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2E2A26">Karbon naik &#8594; 引張強さ naik, 伸び turun, 溶接性 (kemudahan las) juga menurun</text>
    <text x="360" y="42" text-anchor="middle" font-size="10" fill="#6B6459">Baja berkarbon tinggi: lebih kuat &amp; keras, tapi lebih getas &amp; sulit dilas</text>
  </g>
</svg>
