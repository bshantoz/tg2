<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F3F7ED"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#2A2F22">Tahapan Budidaya Padi</text>
  <text x="400" y="56" text-anchor="middle" font-size="14" fill="#6B7A5E">稲作の流れ</text>

  <defs>
    <marker id="apP" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4E7A34"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#2A2F22">
    <!-- Step 1 -->
    <g transform="translate(24,95)">
      <rect width="164" height="120" rx="14" fill="#FFFFFF" stroke="#4E7A34" stroke-width="3"/>
      <circle cx="82" cy="30" r="16" fill="#365523"/>
      <path d="M82 38 v-14 M76 30 q6 -6 12 0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="82" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Persemaian &amp;</text>
      <text x="82" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Pembibitan</text>
      <text x="82" y="94" text-anchor="middle" font-size="9.5" fill="#6B7A5E">育苗 / ikubyou</text>
    </g>
    <line x1="188" y1="155" x2="204" y2="155" stroke="#4E7A34" stroke-width="3" marker-end="url(#apP)"/>

    <!-- Step 2 -->
    <g transform="translate(204,95)">
      <rect width="164" height="120" rx="14" fill="#FFFFFF" stroke="#4E7A34" stroke-width="3"/>
      <circle cx="82" cy="30" r="16" fill="#365523"/>
      <path d="M74 38 v-16 M82 38 v-16 M90 38 v-16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <text x="82" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Tanam Pindah</text>
      <text x="82" y="76" text-anchor="middle" font-weight="700" font-size="10.5">(Mesin Tanam)</text>
      <text x="82" y="94" text-anchor="middle" font-size="9.5" fill="#6B7A5E">田植え / taue</text>
    </g>
    <line x1="368" y1="155" x2="384" y2="155" stroke="#4E7A34" stroke-width="3" marker-end="url(#apP)"/>

    <!-- Step 3 -->
    <g transform="translate(384,95)">
      <rect width="164" height="120" rx="14" fill="#FFFFFF" stroke="#4E7A34" stroke-width="3"/>
      <circle cx="82" cy="30" r="16" fill="#365523"/>
      <path d="M70 34 q4 -8 6 0 q4 -8 6 0 q4 -8 6 0 q4 -8 6 0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="82" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Perawatan Air</text>
      <text x="82" y="76" text-anchor="middle" font-weight="700" font-size="10.5">(termasuk 中干し)</text>
      <text x="82" y="94" text-anchor="middle" font-size="9.5" fill="#6B7A5E">水管理 / mizu kanri</text>
    </g>
    <line x1="548" y1="155" x2="564" y2="155" stroke="#4E7A34" stroke-width="3" marker-end="url(#apP)"/>

    <!-- Step 4 -->
    <g transform="translate(564,95)">
      <rect width="212" height="120" rx="14" fill="#FFFFFF" stroke="#4E7A34" stroke-width="3"/>
      <circle cx="106" cy="30" r="16" fill="#365523"/>
      <rect x="98" y="20" width="16" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="102" cy="42" r="2.4" fill="#FFFFFF"/>
      <circle cx="110" cy="42" r="2.4" fill="#FFFFFF"/>
      <text x="106" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Panen dengan Combine</text>
      <text x="106" y="76" text-anchor="middle" font-weight="700" font-size="10.5">&amp; Pengeringan Gabah</text>
      <text x="106" y="94" text-anchor="middle" font-size="9.5" fill="#6B7A5E">収穫 / shuukaku (自脱型コンバイン)</text>
    </g>
  </g>

  <!-- ground / paddy accent -->
  <rect x="0" y="244" width="800" height="56" fill="#DCE7CB"/>
  <path d="M0,244 Q200,236 400,244 T800,244" fill="none" stroke="#B8CC9C" stroke-width="2"/>
</svg>
