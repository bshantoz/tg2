<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#FBF4EC"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#332A22">Kandang Baterai Ayam Petelur</text>
  <text x="400" y="50" text-anchor="middle" font-size="12.5" fill="#8A7A6B">採卵鶏のケージ飼育と防鳥ネット</text>

  <!-- Outer biosecurity net boundary -->
  <rect x="40" y="66" width="720" height="210" rx="16" fill="none" stroke="#B5652E" stroke-width="3" stroke-dasharray="3 6"/>
  <text x="60" y="88" font-size="10" fill="#B5652E" font-weight="700">衛生管理区域 (zona sanitasi)</text>

  <!-- Anti-bird netting pattern along top -->
  <g stroke="#8A7A6B" stroke-width="1">
    <line x1="60" y1="66" x2="60" y2="96"/>
    <line x1="60" y1="96" x2="90" y2="66"/>
    <line x1="90" y1="66" x2="90" y2="96"/>
    <line x1="90" y1="96" x2="120" y2="66"/>
    <line x1="120" y1="66" x2="120" y2="96"/>
    <line x1="120" y1="96" x2="150" y2="66"/>
  </g>

  <!-- Tiered battery cage: 3 rows x 4 columns -->
  <g transform="translate(200,110)">
    <rect x="-30" y="-14" width="500" height="180" rx="10" fill="#FFFFFF" stroke="#7A4319" stroke-width="3"/>
    <!-- row 1 -->
    <g transform="translate(0,0)">
      <line x1="-20" y1="40" x2="440" y2="40" stroke="#D9C6A8" stroke-width="2"/>
      <g id="row1"></g>
    </g>

    <!-- helper: draw 4 cages per row with hens, 3 rows -->
    <g font-size="0">
    </g>

    <!-- Row 1 (top) -->
    <g transform="translate(0,-2)">
      <rect x="-20" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="80" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="180" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="280" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <g fill="#D9A54A"><circle cx="20" cy="22" r="9"/><circle cx="120" cy="22" r="9"/><circle cx="220" cy="22" r="9"/><circle cx="320" cy="22" r="9"/></g>
      <g fill="#7A4319"><circle cx="26" cy="16" r="3"/><circle cx="126" cy="16" r="3"/><circle cx="226" cy="16" r="3"/><circle cx="326" cy="16" r="3"/></g>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0,58)">
      <rect x="-20" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="80" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="180" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="280" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <g fill="#D9A54A"><circle cx="20" cy="22" r="9"/><circle cx="120" cy="22" r="9"/><circle cx="220" cy="22" r="9"/><circle cx="320" cy="22" r="9"/></g>
      <g fill="#7A4319"><circle cx="26" cy="16" r="3"/><circle cx="126" cy="16" r="3"/><circle cx="226" cy="16" r="3"/><circle cx="326" cy="16" r="3"/></g>
      <!-- egg rolling out -->
      <ellipse cx="0" cy="30" rx="5" ry="7" fill="#FBF4EC" stroke="#7A4319" stroke-width="1.4"/>
    </g>
    <!-- Row 3 -->
    <g transform="translate(0,116)">
      <rect x="-20" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="80" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="180" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <rect x="280" y="0" width="100" height="40" fill="none" stroke="#B5652E" stroke-width="1.6"/>
      <g fill="#D9A54A"><circle cx="20" cy="22" r="9"/><circle cx="120" cy="22" r="9"/><circle cx="220" cy="22" r="9"/><circle cx="320" cy="22" r="9"/></g>
      <g fill="#7A4319"><circle cx="26" cy="16" r="3"/><circle cx="126" cy="16" r="3"/><circle cx="226" cy="16" r="3"/><circle cx="326" cy="16" r="3"/></g>
    </g>
  </g>

  <!-- Labels -->
  <g transform="translate(200,90)">
    <text x="0" y="0" font-size="11.5" font-weight="700" fill="#332A22">Kandang Baterai Bertingkat</text>
    <text x="0" y="14" font-size="9.5" fill="#8A7A6B">&#12465;&#12540;&#12472;&#39131;&#32946; (k&#275;ji shiiku)</text>
  </g>

  <g transform="translate(56,250)">
    <rect x="0" y="0" width="230" height="26" rx="7" fill="#FFFFFF" stroke="#B5652E" stroke-width="1.6"/>
    <text x="115" y="17" text-anchor="middle" font-size="9.5" fill="#332A22" font-weight="700">&#40165;&#12452;&#12531;&#12501;&#12523;&#12456;&#12531;&#12470; waspada flu burung</text>
  </g>
  <g transform="translate(320,250)">
    <rect x="0" y="0" width="230" height="26" rx="7" fill="#FFFFFF" stroke="#B5652E" stroke-width="1.6"/>
    <text x="115" y="17" text-anchor="middle" font-size="9.5" fill="#332A22" font-weight="700">Jaring anti-burung liar (&#38450;&#40165;&#12493;&#12483;&#12488;)</text>
  </g>
</svg>
