<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#FBF4EC"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#332A22">Traktor &amp; Alat Berat Peternakan</text>
  <text x="400" y="53" text-anchor="middle" font-size="13" fill="#8A7A6B">乗用型トラクターと刈払機 (torakut&#257; / kariharaiki)</text>

  <!-- Divider -->
  <line x1="400" y1="72" x2="400" y2="284" stroke="#E3D2BC" stroke-width="2"/>

  <!-- LEFT: Tractor -->
  <g transform="translate(30,90)">
    <rect x="0" y="0" width="330" height="180" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="2"/>
    <text x="165" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#332A22">Traktor Roda Empat</text>
    <text x="165" y="39" text-anchor="middle" font-size="10" fill="#8A7A6B">乗用型トラクター (j&#333;y&#333;gata torakut&#257;)</text>

    <!-- ground -->
    <line x1="30" y1="150" x2="300" y2="150" stroke="#D9C6A8" stroke-width="3"/>

    <!-- body -->
    <rect x="70" y="95" width="120" height="40" rx="6" fill="#B5652E"/>
    <!-- ROPS cabin frame -->
    <path d="M150,95 L150,55 Q150,45 160,45 L235,45 Q245,45 245,55 L245,95" fill="none" stroke="#7A4319" stroke-width="7" stroke-linejoin="round"/>
    <rect x="158" y="60" width="80" height="35" rx="4" fill="#D9EEF2" opacity="0.85" stroke="#7A4319" stroke-width="2"/>
    <!-- seat + operator with helmet & seatbelt -->
    <circle cx="198" cy="72" r="9" fill="#EBC79E"/>
    <path d="M191,68 Q198,58 205,68 Z" fill="#D9A54A"/>
    <rect x="190" y="80" width="16" height="14" rx="3" fill="#332A22"/>
    <line x1="190" y1="82" x2="206" y2="92" stroke="#FBF4EC" stroke-width="2"/>
    <!-- hood -->
    <path d="M70,95 L50,95 L45,120 L70,130 Z" fill="#D9A54A"/>
    <rect x="45" y="88" width="10" height="8" fill="#7A4319"/>
    <!-- wheels -->
    <circle cx="90" cy="150" r="26" fill="#332A22"/>
    <circle cx="90" cy="150" r="10" fill="#8A7A6B"/>
    <circle cx="210" cy="150" r="34" fill="#332A22"/>
    <circle cx="210" cy="150" r="14" fill="#8A7A6B"/>

    <!-- labels -->
    <g font-size="9.5" fill="#8A7A6B">
      <text x="200" y="30" text-anchor="middle" fill="#B5652E" font-weight="700" font-size="9">&#8592; ROPS 転倒保護</text>
    </g>
    <g transform="translate(15,152)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#FBF4EC" stroke="#B5652E" stroke-width="1.4"/>
      <text x="45" y="11" text-anchor="middle" font-size="8.5" font-weight="700" fill="#332A22">Sabuk pengaman</text>
      <text x="45" y="21" text-anchor="middle" font-size="7.5" fill="#8A7A6B">シートベルト必須</text>
    </g>
    <g transform="translate(220,10)">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#FBF4EC" stroke="#B5652E" stroke-width="1.4"/>
      <text x="50" y="11" text-anchor="middle" font-size="8.5" font-weight="700" fill="#332A22">Turun mundur</text>
      <text x="50" y="21" text-anchor="middle" font-size="7.5" fill="#8A7A6B">後ろ向きで降車</text>
    </g>
  </g>

  <!-- RIGHT: Worker with brush cutter -->
  <g transform="translate(430,90)">
    <rect x="0" y="0" width="330" height="180" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="2"/>
    <text x="165" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#332A22">Mesin Potong Rumput Genggam</text>
    <text x="165" y="39" text-anchor="middle" font-size="10" fill="#8A7A6B">刈払機 (kariharaiki)</text>

    <line x1="20" y1="158" x2="310" y2="158" stroke="#D9C6A8" stroke-width="3"/>

    <!-- worker -->
    <g transform="translate(95,60)">
      <circle cx="0" cy="0" r="13" fill="#EBC79E"/>
      <rect x="-11" y="-20" width="22" height="9" rx="4" fill="#D9A54A"/>
      <rect x="-10" y="-14" width="8" height="6" fill="#332A22" opacity="0.8"/>
      <path d="M-16,13 Q0,4 16,13 L16,55 Q0,66 -16,55 Z" fill="#B5652E"/>
      <rect x="-20" y="15" width="14" height="46" rx="7" fill="#7A4319"/>
      <rect x="-24" y="60" width="20" height="12" rx="5" fill="#332A22"/>
      <rect x="10" y="55" width="14" height="18" rx="6" fill="#332A22"/>
      <rect x="6" y="70" width="20" height="12" rx="5" fill="#332A22"/>
      <!-- arm holding shaft -->
      <path d="M15,25 L60,40" stroke="#B5652E" stroke-width="10" stroke-linecap="round"/>
      <circle cx="58" cy="40" r="7" fill="#7A4319"/>
    </g>
    <!-- brush cutter shaft + blade -->
    <g transform="translate(153,100)">
      <line x1="0" y1="0" x2="150" y2="18" stroke="#7A4319" stroke-width="6" stroke-linecap="round"/>
      <circle cx="150" cy="18" r="26" fill="none" stroke="#B5652E" stroke-width="3"/>
      <!-- 1/3 left usable arc highlighted -->
      <path d="M150,18 L176,18 A26,26 0 0 1 156,42 Z" fill="#D9A54A" opacity="0.85"/>
      <circle cx="150" cy="18" r="4" fill="#332A22"/>
      <path d="M150,18 L120,-4" stroke="#332A22" stroke-width="3" stroke-linecap="round"/>
      <path d="M150,18 L120,40" stroke="#332A22" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g font-size="9" fill="#332A22" text-anchor="middle">
      <text x="303" y="98">1/3 kiri</text>
      <text x="303" y="109" fill="#8A7A6B" font-size="8">左1/3使用</text>
    </g>
    <g transform="translate(20,150)">
      <rect x="0" y="0" width="128" height="28" rx="6" fill="#FBF4EC" stroke="#B5652E" stroke-width="1.4"/>
      <text x="64" y="12" text-anchor="middle" font-size="8.5" font-weight="700" fill="#332A22">Potong kanan &#8594; kiri</text>
      <text x="64" y="23" text-anchor="middle" font-size="7.5" fill="#8A7A6B">一方向に刈る・15m間隔</text>
    </g>
  </g>
</svg>
