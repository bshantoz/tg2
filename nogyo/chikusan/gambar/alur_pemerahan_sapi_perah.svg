<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#FBF4EC"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#332A22">Alur Pemerahan Sapi Perah</text>
  <text x="400" y="53" text-anchor="middle" font-size="13" fill="#8A7A6B">搾乳の流れ (sakuny&#363; no nagare)</text>

  <defs>
    <marker id="pm-ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B5652E"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#332A22">
    <!-- Step 1: Cow + teat cup -->
    <g transform="translate(24,90)">
      <rect width="170" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <!-- cow -->
      <g transform="translate(85,58)">
        <ellipse cx="0" cy="0" rx="46" ry="26" fill="#FFFFFF" stroke="#7A4319" stroke-width="3"/>
        <circle cx="-30" cy="30" r="8" fill="#7A4319"/>
        <circle cx="-10" cy="34" r="8" fill="#7A4319"/>
        <circle cx="10" cy="34" r="8" fill="#7A4319"/>
        <circle cx="30" cy="30" r="8" fill="#7A4319"/>
        <ellipse cx="0" cy="18" rx="20" ry="12" fill="#EBC79E"/>
        <circle cx="-44" cy="-6" r="14" fill="#FFFFFF" stroke="#7A4319" stroke-width="3"/>
        <ellipse cx="-52" cy="-4" rx="4" ry="6" fill="#332A22"/>
        <!-- teat cups -->
        <rect x="-6" y="26" width="5" height="10" rx="2" fill="#B5652E"/>
        <rect x="1" y="26" width="5" height="10" rx="2" fill="#B5652E"/>
      </g>
      <text x="85" y="120" text-anchor="middle" font-weight="700" font-size="10.5">Pemasangan</text>
      <text x="85" y="134" text-anchor="middle" font-size="9.5" fill="#8A7A6B">ティートカップ装着</text>
    </g>
    <line x1="194" y1="165" x2="212" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#pm-ap)"/>

    <!-- Step 2: Teat cup close-up -->
    <g transform="translate(212,90)">
      <rect width="170" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <circle cx="85" cy="46" r="18" fill="#7A4319"/>
      <path d="M70,42 q15,-10 30,0 q-4,18 -15,18 q-11,0 -15,-18 z" fill="#FBF4EC"/>
      <rect x="78" y="60" width="14" height="26" rx="4" fill="#B5652E"/>
      <text x="85" y="120" text-anchor="middle" font-weight="700" font-size="10.5">Teat Cup</text>
      <text x="85" y="134" text-anchor="middle" font-size="9.5" fill="#8A7A6B">&#12486;&#12451;&#12540;&#12488;&#12459;&#12483;&#12503;</text>
    </g>
    <line x1="382" y1="165" x2="400" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#pm-ap)"/>

    <!-- Step 3: Pipeline -->
    <g transform="translate(400,90)">
      <rect width="170" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <path d="M20,60 h60 v-20 h60 v20 h10" fill="none" stroke="#B5652E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="60" r="6" fill="#7A4319"/>
      <circle cx="150" cy="60" r="6" fill="#7A4319"/>
      <text x="85" y="120" text-anchor="middle" font-weight="700" font-size="10.5">Pipeline Milker</text>
      <text x="85" y="134" text-anchor="middle" font-size="9.5" fill="#8A7A6B">&#12497;&#12452;&#12503;&#12521;&#12452;&#12531;&#12511;&#12523;&#12459;&#12540;</text>
    </g>
    <line x1="570" y1="165" x2="588" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#pm-ap)"/>

    <!-- Step 4: Bulk cooler -->
    <g transform="translate(588,90)">
      <rect width="188" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <rect x="54" y="24" width="80" height="60" rx="8" fill="#7A4319"/>
      <path d="M60,84 q34,18 68,0 v20 q-34,16 -68,0 z" fill="#D9EEF2"/>
      <path d="M94,20 L94,-4" stroke="#7A4319" stroke-width="4" stroke-linecap="round"/>
      <path d="M84,-4 h20" stroke="#7A4319" stroke-width="4" stroke-linecap="round"/>
      <text x="94" y="120" text-anchor="middle" font-weight="700" font-size="10.5">Bulk Cooler</text>
      <text x="94" y="134" text-anchor="middle" font-size="9.5" fill="#8A7A6B">&#12496;&#12523;&#12463;&#12463;&#12540;&#12521;&#12540; (susu didinginkan)</text>
    </g>
  </g>
</svg>
