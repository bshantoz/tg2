<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#FBF4EC"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#332A22">Tahap Pemeliharaan Kuda Ringan</text>
  <text x="400" y="50" text-anchor="middle" font-size="12.5" fill="#8A7A6B">&#36393;&#31278;&#39340;&#12398;&#25104;&#38263;&#27573;&#38542; (keishuba no seich&#333; dankai)</text>

  <defs>
    <marker id="hor-ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B5652E"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#332A22">
    <!-- Stage 1: Foal with mare -->
    <g transform="translate(24,90)">
      <rect width="176" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <!-- mare -->
      <g transform="translate(58,60)">
        <ellipse cx="0" cy="10" rx="34" ry="18" fill="#7A4319"/>
        <path d="M-30,0 q-14,-14 -6,-28 q10,2 12,16 z" fill="#7A4319"/>
        <rect x="-24" y="24" width="6" height="16" fill="#7A4319"/><rect x="16" y="24" width="6" height="16" fill="#7A4319"/>
      </g>
      <!-- foal -->
      <g transform="translate(118,74)">
        <ellipse cx="0" cy="6" rx="18" ry="11" fill="#D9A54A"/>
        <path d="M-16,0 q-8,-8 -3,-16 q6,1 7,10 z" fill="#D9A54A"/>
        <rect x="-12" y="14" width="4" height="10" fill="#D9A54A"/><rect x="8" y="14" width="4" height="10" fill="#D9A54A"/>
      </g>
      <text x="88" y="122" text-anchor="middle" font-weight="700" font-size="10.5">Anak Kuda + Induk</text>
      <text x="88" y="136" text-anchor="middle" font-size="9" fill="#8A7A6B">&#24403;&#27507; (t&#333;sai)</text>
    </g>
    <line x1="200" y1="165" x2="216" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#hor-ap)"/>

    <!-- Stage 2: Weaning autumn -->
    <g transform="translate(216,90)">
      <rect width="176" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <g transform="translate(88,68)">
        <ellipse cx="0" cy="6" rx="22" ry="13" fill="#D9A54A"/>
        <path d="M-19,0 q-9,-9 -4,-18 q7,1 8,11 z" fill="#D9A54A"/>
        <rect x="-15" y="16" width="5" height="12" fill="#D9A54A"/><rect x="10" y="16" width="5" height="12" fill="#D9A54A"/>
      </g>
      <!-- leaf icons for autumn -->
      <path d="M30,40 q6,-8 12,0 q-6,8 -12,0" fill="#B5652E"/>
      <path d="M146,44 q6,-8 12,0 q-6,8 -12,0" fill="#D9A54A"/>
      <text x="88" y="122" text-anchor="middle" font-weight="700" font-size="10.5">Penyapihan</text>
      <text x="88" y="136" text-anchor="middle" font-size="9" fill="#8A7A6B">&#38626;&#20083; (rin&#363;) &#177;6 bulan</text>
    </g>
    <line x1="392" y1="165" x2="408" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#hor-ap)"/>

    <!-- Stage 3: Age 1 halter training -->
    <g transform="translate(408,90)">
      <rect width="176" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <g transform="translate(88,66)">
        <ellipse cx="0" cy="8" rx="28" ry="15" fill="#7A4319"/>
        <path d="M-24,0 q-11,-11 -5,-22 q8,1 9,13 z" fill="#7A4319"/>
        <rect x="-19" y="20" width="6" height="14" fill="#7A4319"/><rect x="13" y="20" width="6" height="14" fill="#7A4319"/>
        <!-- kura/saddle + hami -->
        <rect x="-14" y="-6" width="30" height="9" rx="3" fill="#B5652E"/>
        <line x1="-22" y1="-2" x2="-30" y2="6" stroke="#332A22" stroke-width="2"/>
      </g>
      <text x="88" y="122" text-anchor="middle" font-weight="700" font-size="10.5">Pembiasaan Tunggangan</text>
      <text x="88" y="136" text-anchor="middle" font-size="9" fill="#8A7A6B">&#39569;&#20055;&#39511;&#33268; usia 1 tahun</text>
    </g>
    <line x1="584" y1="165" x2="600" y2="165" stroke="#B5652E" stroke-width="3" marker-end="url(#hor-ap)"/>

    <!-- Stage 4: Age 2 race training -->
    <g transform="translate(600,90)">
      <rect width="176" height="150" rx="14" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
      <g transform="translate(88,66)">
        <ellipse cx="0" cy="8" rx="30" ry="15" fill="#332A22"/>
        <path d="M-26,0 q-12,-12 -6,-24 q9,1 10,14 z" fill="#332A22"/>
        <rect x="-20" y="20" width="6" height="14" fill="#332A22"/><rect x="14" y="20" width="6" height="14" fill="#332A22"/>
        <path d="M-6,20 l-10,20 M10,20 l10,20" stroke="#332A22" stroke-width="4" stroke-linecap="round"/>
        <!-- speed lines -->
        <line x1="-46" y1="4" x2="-34" y2="4" stroke="#B5652E" stroke-width="2"/>
        <line x1="-50" y1="12" x2="-38" y2="12" stroke="#B5652E" stroke-width="2"/>
      </g>
      <text x="88" y="122" text-anchor="middle" font-weight="700" font-size="10.5">Latihan Balap</text>
      <text x="88" y="136" text-anchor="middle" font-size="9" fill="#8A7A6B">&#35519;&#25945; (ch&#333;ky&#333;) usia 2 tahun</text>
    </g>
  </g>
</svg>
