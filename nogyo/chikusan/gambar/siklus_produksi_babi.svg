<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#FBF4EC"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#332A22">Persilangan Tiga Bangsa Babi</text>
  <text x="400" y="50" text-anchor="middle" font-size="12.5" fill="#8A7A6B">三元交配 (sangen k&#333;hai)</text>

  <defs>
    <marker id="pig-ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B5652E"/>
    </marker>
  </defs>

  <g id="pigicon">
  </g>

  <!-- reusable pig shape function via <g> template calls -->
  <!-- Pig 1: Landrace -->
  <g transform="translate(90,90)">
    <ellipse cx="0" cy="20" rx="40" ry="24" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
    <circle cx="34" cy="6" r="16" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
    <ellipse cx="40" cy="8" rx="6" ry="4" fill="#7A4319"/>
    <path d="M22,-6 l8,-10 l2,12 z" fill="#FFFFFF" stroke="#B5652E" stroke-width="2"/>
    <circle cx="-20" cy="36" r="7" fill="#7A4319"/><circle cx="20" cy="36" r="7" fill="#7A4319"/>
    <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#332A22">Landrace (L)</text>
    <text x="0" y="80" text-anchor="middle" font-size="9" fill="#8A7A6B">&#12521;&#12531;&#12489;&#12524;&#12540;&#12473;</text>
  </g>

  <text x="176" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#B5652E">&#215;</text>

  <!-- Pig 2: Large Yorkshire -->
  <g transform="translate(262,90)">
    <ellipse cx="0" cy="20" rx="40" ry="24" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
    <circle cx="34" cy="6" r="16" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
    <ellipse cx="40" cy="8" rx="6" ry="4" fill="#7A4319"/>
    <path d="M22,-8 l6,-10 l4,11 z" fill="#FFFFFF" stroke="#B5652E" stroke-width="2"/>
    <circle cx="-20" cy="36" r="7" fill="#7A4319"/><circle cx="20" cy="36" r="7" fill="#7A4319"/>
    <text x="0" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#332A22">Large Yorkshire (W)</text>
    <text x="0" y="80" text-anchor="middle" font-size="9" fill="#8A7A6B">&#22823;&#12520;&#12540;&#12463;&#12471;&#12515;&#12540;</text>
  </g>

  <!-- arrow down to LW sow -->
  <line x1="176" y1="185" x2="176" y2="210" stroke="#B5652E" stroke-width="3" marker-end="url(#pig-ap)"/>

  <!-- LW sow -->
  <g transform="translate(176,235)">
    <ellipse cx="0" cy="0" rx="46" ry="27" fill="#D9A54A" stroke="#7A4319" stroke-width="3"/>
    <circle cx="38" cy="-12" r="17" fill="#D9A54A" stroke="#7A4319" stroke-width="3"/>
    <circle cx="45" cy="-10" r="6" fill="#7A4319"/>
    <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#332A22">LW</text>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#332A22">Induk (&#27597;&#35910; bobuton)</text>
  </g>

  <!-- x Duroc -->
  <text x="330" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#B5652E">&#215;</text>
  <g transform="translate(410,235)">
    <ellipse cx="0" cy="0" rx="40" ry="24" fill="#7A4319" stroke="#332A22" stroke-width="3"/>
    <circle cx="34" cy="-12" r="16" fill="#7A4319" stroke="#332A22" stroke-width="3"/>
    <circle cx="40" cy="-10" r="6" fill="#332A22"/>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#332A22">Pejantan Duroc (D)</text>
    <text x="0" y="60" text-anchor="middle" font-size="9" fill="#8A7A6B">&#12487;&#12517;&#12525;&#12483;&#12463;</text>
  </g>

  <!-- arrow to LWD -->
  <line x1="465" y1="228" x2="560" y2="180" stroke="#B5652E" stroke-width="3" marker-end="url(#pig-ap)"/>

  <!-- LWD market pig -->
  <g transform="translate(660,150)">
    <rect x="-110" y="-95" width="220" height="190" rx="16" fill="#FFFFFF" stroke="#B5652E" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="56" ry="34" fill="#B5652E" stroke="#7A4319" stroke-width="3"/>
    <circle cx="46" cy="-10" r="20" fill="#B5652E" stroke="#7A4319" stroke-width="3"/>
    <circle cx="55" cy="-8" r="7" fill="#7A4319"/>
    <circle cx="-24" cy="30" r="9" fill="#7A4319"/><circle cx="24" cy="30" r="9" fill="#7A4319"/>
    <text x="0" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#332A22">LWD</text>
    <text x="0" y="-58" text-anchor="middle" font-size="12" font-weight="700" fill="#332A22">Babi Potong</text>
    <text x="0" y="-45" text-anchor="middle" font-size="9.5" fill="#8A7A6B">&#32933;&#32946;&#35910; (hiikuton)</text>
  </g>

  <text x="660" y="272" text-anchor="middle" font-size="9.5" fill="#8A7A6B">雑種強勢 (zasshu ky&#333;sei) — pertumbuhan lebih cepat &amp; tahan penyakit</text>
</svg>
