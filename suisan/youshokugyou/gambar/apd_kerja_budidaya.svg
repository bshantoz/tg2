<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#EAF6F2"/>
  <text x="400" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#1C3A3A">APD Dasar Kerja di Area Budidaya Perikanan</text>
  <text x="400" y="56" text-anchor="middle" font-size="14" fill="#5A8F87">養殖現場の基本装備</text>

  <!-- water -->
  <rect x="0" y="266" width="800" height="34" fill="#BFE0DC"/>
  <path d="M0,266 Q100,260 200,266 T400,266 T600,266 T800,266" fill="none" stroke="#8FC3B8" stroke-width="2"/>

  <!-- pontoon/keramba deck -->
  <rect x="0" y="236" width="800" height="30" fill="#B98858"/>
  <path d="M40,236 v30 M120,236 v30 M200,236 v30 M280,236 v30 M360,236 v30 M440,236 v30 M520,236 v30 M600,236 v30 M680,236 v30 M760,236 v30" stroke="#9C6F45" stroke-width="2"/>
  <!-- floats under pontoon -->
  <circle cx="90" cy="270" r="14" fill="#2E8B7A"/>
  <circle cx="300" cy="270" r="14" fill="#2E8B7A"/>
  <circle cx="520" cy="270" r="14" fill="#2E8B7A"/>
  <circle cx="710" cy="270" r="14" fill="#2E8B7A"/>

  <!-- leader lines -->
  <g stroke="#13715E" stroke-width="2" fill="none">
    <line x1="178" y1="98" x2="386" y2="86"/>
    <line x1="178" y1="150" x2="372" y2="140"/>
    <line x1="622" y1="98" x2="415" y2="92"/>
    <line x1="178" y1="205" x2="378" y2="188"/>
    <line x1="622" y1="150" x2="426" y2="168"/>
    <line x1="622" y1="205" x2="404" y2="226"/>
  </g>
  <g fill="#13715E">
    <circle cx="386" cy="86" r="3.5"/>
    <circle cx="372" cy="140" r="3.5"/>
    <circle cx="415" cy="92" r="3.5"/>
    <circle cx="378" cy="188" r="3.5"/>
    <circle cx="426" cy="168" r="3.5"/>
    <circle cx="404" cy="226" r="3.5"/>
  </g>

  <!-- person -->
  <g>
    <!-- legs -->
    <rect x="384" y="192" width="15" height="40" rx="5" fill="#2E3B4E"/>
    <rect x="401" y="192" width="15" height="40" rx="5" fill="#2E3B4E"/>
    <!-- boots -->
    <path d="M380 228 h22 v9 q0 6 -6 6 h-16 q-4 0 -4 -3 z" fill="#1C2733"/>
    <path d="M398 228 h22 v9 q0 6 -6 6 h-16 q-4 0 -4 -3 z" fill="#1C2733"/>
    <!-- torso overalls -->
    <rect x="374" y="126" width="52" height="60" rx="10" fill="#2E8B7A"/>
    <!-- life jacket -->
    <path d="M380 130 h40 l-4 54 h-32 z" fill="#FF6A2B"/>
    <path d="M380 142 h40 M380 155 h40 M380 168 h40" stroke="#FFD9A8" stroke-width="3"/>
    <rect x="394" y="130" width="12" height="54" fill="#E85A1E"/>
    <!-- arms -->
    <path d="M374 134 q-16 10 -18 36" stroke="#1F6657" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M426 134 q16 10 18 36" stroke="#1F6657" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- gloves -->
    <circle cx="356" cy="172" r="9" fill="#FFCF4D"/>
    <circle cx="444" cy="172" r="9" fill="#FFCF4D"/>
    <!-- neck -->
    <rect x="393" y="114" width="14" height="12" fill="#E8C39B"/>
    <!-- head -->
    <circle cx="400" cy="100" r="20" fill="#E8C39B"/>
    <!-- face -->
    <circle cx="393" cy="100" r="1.8" fill="#2A2F22"/>
    <circle cx="407" cy="100" r="1.8" fill="#2A2F22"/>
    <!-- cap -->
    <path d="M378 92 a22 18 0 0 1 44 0 z" fill="#13715E"/>
    <rect x="376" y="90" width="48" height="6" rx="3" fill="#0C4F41"/>
  </g>

  <!-- callout boxes -->
  <g font-size="11" fill="#1C3A3A">
    <g transform="translate(50,66)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Topi/Cap Kerja</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">作業帽</text>
    </g>
    <g transform="translate(50,128)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Jaket Pelampung</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">救命胴衣</text>
    </g>
    <g transform="translate(50,183)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Sarung Tangan Karet</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">ゴム手袋</text>
    </g>
    <g transform="translate(622,66)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Overall Tahan Air</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">防水つなぎ</text>
    </g>
    <g transform="translate(622,128)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Sarung Tangan Kerja</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">作業用手袋</text>
    </g>
    <g transform="translate(622,183)">
      <rect width="128" height="44" rx="10" fill="#FFFFFF" stroke="#13715E" stroke-width="2.5"/>
      <text x="64" y="19" text-anchor="middle" font-weight="700" font-size="11.5">Sepatu Boots Anti Slip</text>
      <text x="64" y="34" text-anchor="middle" font-size="9.5" fill="#5A8F87">滑り止め長靴</text>
    </g>
  </g>
</svg>
