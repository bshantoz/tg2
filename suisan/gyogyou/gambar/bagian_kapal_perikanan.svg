<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="330" fill="#EAF4FA"/>
  <text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1C3A4B">Bagian-Bagian Kapal Perikanan</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#5A7F93">漁船の各部名称</text>

  <!-- water -->
  <rect x="0" y="252" width="800" height="78" fill="#BFE0EE"/>
  <path d="M0,252 Q100,246 200,252 T400,252 T600,252 T800,252" fill="none" stroke="#8FC3DA" stroke-width="2"/>
  <path d="M0,266 Q100,260 200,266 T400,266 T600,266 T800,266" fill="none" stroke="#9ECEE1" stroke-width="1.5"/>

  <!-- hull -->
  <path d="M110,230 Q100,202 150,190 L590,190 Q640,190 650,212 L640,236 Q590,250 410,250 L170,250 Q120,250 110,230 Z"
        fill="#1F4E66" stroke="#113347" stroke-width="2"/>
  <!-- deck line -->
  <rect x="160" y="182" width="440" height="10" rx="4" fill="#CBD8DC"/>

  <!-- wheelhouse (stern side, right) -->
  <rect x="495" y="118" width="90" height="72" rx="4" fill="#E7EDEF" stroke="#8098A0" stroke-width="2"/>
  <rect x="506" y="130" width="24" height="20" rx="2" fill="#9FD3E8" stroke="#5A7F93" stroke-width="1.5"/>
  <rect x="538" y="130" width="24" height="20" rx="2" fill="#9FD3E8" stroke="#5A7F93" stroke-width="1.5"/>
  <rect x="499" y="108" width="82" height="10" rx="3" fill="#8098A0"/>
  <!-- antenna / mast -->
  <line x1="540" y1="108" x2="540" y2="68" stroke="#5A7F93" stroke-width="3"/>
  <circle cx="540" cy="66" r="4" fill="#F2A627"/>
  <line x1="570" y1="108" x2="570" y2="80" stroke="#5A7F93" stroke-width="3"/>

  <!-- winch on deck -->
  <circle cx="330" cy="182" r="15" fill="#3E7A95" stroke="#1F4E66" stroke-width="2"/>
  <circle cx="330" cy="182" r="6" fill="#113347"/>
  <rect x="315" y="180" width="30" height="5" fill="#113347"/>

  <!-- fish hold hatch -->
  <rect x="220" y="180" width="58" height="9" rx="2" fill="#C94E1C" stroke="#8C3614" stroke-width="2"/>

  <!-- leader lines -->
  <g stroke="#0B5C8C" stroke-width="2" fill="none">
    <line x1="150" y1="98" x2="128" y2="205"/>
    <line x1="330" y1="98" x2="330" y2="167"/>
    <line x1="560" y1="98" x2="540" y2="118"/>
    <line x1="220" y1="212" x2="249" y2="188"/>
    <line x1="400" y1="212" x2="400" y2="192"/>
    <line x1="600" y1="212" x2="612" y2="222"/>
  </g>
  <g fill="#0B5C8C">
    <circle cx="128" cy="205" r="3.5"/>
    <circle cx="330" cy="167" r="3.5"/>
    <circle cx="540" cy="118" r="3.5"/>
    <circle cx="249" cy="188" r="3.5"/>
    <circle cx="400" cy="192" r="3.5"/>
    <circle cx="612" cy="222" r="3.5"/>
  </g>

  <!-- callout boxes: top row -->
  <g font-size="11" fill="#1C3A4B">
    <g transform="translate(86,58)">
      <rect width="128" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="64" y="17" text-anchor="middle" font-weight="700" font-size="11">Haluan (depan)</text>
      <text x="64" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">船首/senshu</text>
    </g>
    <g transform="translate(266,58)">
      <rect width="128" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="64" y="17" text-anchor="middle" font-weight="700" font-size="11">Winch (Mesin Gulung)</text>
      <text x="64" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">ウインチ</text>
    </g>
    <g transform="translate(496,58)">
      <rect width="130" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="65" y="17" text-anchor="middle" font-weight="700" font-size="11">Ruang Kemudi</text>
      <text x="65" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">操舵室/soudashitsu</text>
    </g>
    <!-- bottom row -->
    <g transform="translate(130,220)">
      <rect width="118" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="59" y="17" text-anchor="middle" font-weight="700" font-size="11">Palka Ikan</text>
      <text x="59" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">魚倉/gyosou</text>
    </g>
    <g transform="translate(340,220)">
      <rect width="118" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="59" y="17" text-anchor="middle" font-weight="700" font-size="11">Geladak</text>
      <text x="59" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">甲板/kanpan</text>
    </g>
    <g transform="translate(550,220)">
      <rect width="130" height="40" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2.5"/>
      <text x="65" y="17" text-anchor="middle" font-weight="700" font-size="11">Buritan (belakang)</text>
      <text x="65" y="31" text-anchor="middle" font-size="9.5" fill="#5A7F93">船尾/senbi</text>
    </g>
  </g>
</svg>
