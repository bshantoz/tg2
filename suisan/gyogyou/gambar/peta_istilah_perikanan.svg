<text x="14" y="33" font-size="9.5" font-style="italic" fill="#5A7F93">sougyou &#8212; kegiatan operasi penangkapan</text>
</g>
<g transform="translate(410,186)">
<rect width="350" height="44" rx="10" fill="#FFFFFF" stroke="#0B5C8C" stroke-width="2"/>
<text x="14" y="18" font-weight="700" font-size="12.5" fill="#1C3A4B">甲板 / kanpan</text>
<text x="14" y="33" font-size="9.5" font-style="italic" fill="#5A7F93">kanpan &#8212; geladak kapal</text>
