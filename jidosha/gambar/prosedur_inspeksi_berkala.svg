<circle cx="66" cy="28" r="9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M73 35 l8 8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#20303F">Pemeriksaan Visual</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#C9542C">目視点検</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A4C5C">Amati kebocoran, retak,</text>
