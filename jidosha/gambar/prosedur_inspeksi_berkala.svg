<path d="M58 38 a14 14 0 0 1 24 0" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 34 l-6 -8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="34" r="2" fill="#FFFFFF"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#20303F">Ukur Parameter</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#C9542C">数値測定</text>
