<circle cx="70" cy="32" r="12" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="32" r="4" fill="#FFFFFF"/><path d="M58 24 l6 4 M82 24 l-6 4 M58 40 l6 -4 M82 40 l-6 -4" stroke="#FFFFFF" stroke-width="1.6"/>
