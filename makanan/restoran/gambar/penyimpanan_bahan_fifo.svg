<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#FFF8F0"/>
  <text x="400" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#2D2A26">Penyimpanan Bahan — Sistem FIFO</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#7A6F63">先入れ先出し (First In, First Out)</text>

  <!-- shelf -->
  <g>
    <rect x="60" y="90" width="680" height="170" rx="14" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
    <line x1="60" y1="175" x2="740" y2="175" stroke="#FFB08A" stroke-width="4"/>

    <!-- old stock front (left), items -->
    <g>
      <rect x="90" y="115" width="36" height="50" rx="4" fill="#E8483D"/>
      <rect x="132" y="115" width="36" height="50" rx="4" fill="#E8483D"/>
      <rect x="174" y="115" width="36" height="50" rx="4" fill="#F2A93B"/>
      <text x="150" y="145" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700"> </text>
    </g>
    <text x="150" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2A26">Stok Lama</text>
    <text x="150" y="212" text-anchor="middle" font-size="11" fill="#7A6F63">古い商品を手前に (Depan)</text>

    <!-- arrow -->
    <path d="M240 140 h280" stroke="#3BA776" stroke-width="5" stroke-linecap="round"/>
    <path d="M510 140 l-16 -10 v20 z" fill="#3BA776"/>
    <text x="380" y="118" text-anchor="middle" font-size="11" fill="#3BA776" font-weight="700">ambil dari depan dulu</text>

    <!-- new stock back (right) -->
    <g>
      <rect x="600" y="115" width="36" height="50" rx="4" fill="#8AB6E8"/>
      <rect x="642" y="115" width="36" height="50" rx="4" fill="#8AB6E8"/>
      <rect x="684" y="115" width="36" height="50" rx="4" fill="#8AB6E8"/>
    </g>
    <text x="660" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2A26">Stok Baru</text>
    <text x="660" y="212" text-anchor="middle" font-size="11" fill="#7A6F63">新しい商品を奥に (Belakang)</text>
  </g>

  <!-- 3 temp zones -->
  <g font-size="12" fill="#2D2A26">
    <g transform="translate(60,300)">
      <rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#F2A93B" stroke-width="3"/>
      <circle cx="40" cy="40" r="22" fill="#FFD8A8"/>
      <text x="105" y="45" text-anchor="middle" font-weight="700" font-size="14">常温</text>
      <text x="105" y="65" text-anchor="middle" font-size="11" fill="#7A6F63">Suhu Ruang</text>
      <text x="105" y="90" text-anchor="middle" font-size="12" fill="#8A5A12">15–25°C</text>
    </g>
    <g transform="translate(295,300)">
      <rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#7EC9C4" stroke-width="3"/>
      <circle cx="40" cy="40" r="22" fill="#DCEFEA"/>
      <text x="105" y="45" text-anchor="middle" font-weight="700" font-size="14">冷蔵</text>
      <text x="105" y="65" text-anchor="middle" font-size="11" fill="#7A6F63">Kulkas</text>
      <text x="105" y="90" text-anchor="middle" font-size="12" fill="#1F7A73">0–10°C</text>
    </g>
    <g transform="translate(530,300)">
      <rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#8AB6E8" stroke-width="3"/>
      <circle cx="40" cy="40" r="22" fill="#D6E6F7"/>
      <text x="105" y="45" text-anchor="middle" font-weight="700" font-size="14">冷凍</text>
      <text x="105" y="65" text-anchor="middle" font-size="11" fill="#7A6F63">Freezer</text>
      <text x="105" y="90" text-anchor="middle" font-size="12" fill="#3468A8">≤ -15°C</text>
    </g>
  </g>
</svg>
