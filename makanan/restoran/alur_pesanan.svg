    <text x="310" y="186" text-anchor="middle" font-size="11" fill="#7A6F63">復唱確認</text>

    <line x1="395" y1="155" x2="425" y2="155" stroke="#E8483D" stroke-width="3" marker-end="url(#arrow2)"/>

    <rect x="430" y="100" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
    <circle cx="515" cy="132" r="18" fill="#FF6B35"/>
    <path d="M505 126 h20 v14 h-20 z M508 126 v-6 h14 v6" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
