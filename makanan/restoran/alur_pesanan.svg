  </defs>

  <g font-size="12" fill="#2D2A26">
    <rect x="20" y="100" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
    <circle cx="105" cy="132" r="18" fill="#FF6B35"/>
    <path d="M96 132 h18 M96 126 h18 M96 138 h12" stroke="#FFFFFF" stroke-width="2.5"/>
