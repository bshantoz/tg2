    <line x1="190" y1="155" x2="220" y2="155" stroke="#E8483D" stroke-width="3" marker-end="url(#arrow2)"/>

    <rect x="225" y="100" width="170" height="110" rx="16" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
    <circle cx="310" cy="132" r="18" fill="#FF6B35"/>
    <path d="M300 132 a10 10 0 1 1 4 8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
