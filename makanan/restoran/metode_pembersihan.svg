<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="360" fill="#FFF8F0"/>
  <text x="400" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#2D2A26">Metode Pembersihan</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#7A6F63">清掃の方法</text>

  <g font-size="13" fill="#2D2A26">
    <!-- Lantai -->
    <g transform="translate(40,90)">
      <rect width="220" height="230" rx="18" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
      <line x1="80" y1="40" x2="110" y2="120" stroke="#8C6239" stroke-width="6" stroke-linecap="round"/>
      <path d="M95 110 l-25 20 M95 115 l-30 8 M95 120 l-28 -2" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/>
      <line x1="150" y1="35" x2="140" y2="125" stroke="#8C6239" stroke-width="6" stroke-linecap="round"/>
      <rect x="115" y="120" width="50" height="20" rx="6" fill="#8AB6E8"/>
      <text x="110" y="175" text-anchor="middle" font-weight="700" font-size="16">Lantai</text>
      <text x="110" y="196" text-anchor="middle" font-size="11" fill="#7A6F63">床</text>
      <text x="110" y="216" text-anchor="middle" font-size="11" fill="#4A433C">Sapu dan pel lantai</text>
      <text x="110" y="233" text-anchor="middle" font-size="11" fill="#4A433C">secara rutin</text>
    </g>

    <!-- Kaca -->
    <g transform="translate(290,90)">
      <rect width="220" height="230" rx="18" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
      <rect x="70" y="35" width="70" height="90" rx="6" fill="#DCEFEA" stroke="#3BA776" stroke-width="3"/>
      <line x1="80" y1="60" x2="130" y2="60" stroke="#3BA776" stroke-width="2"/>
      <line x1="80" y1="90" x2="130" y2="90" stroke="#3BA776" stroke-width="2"/>
      <g transform="translate(150,60) rotate(20)">
        <rect x="0" y="0" width="16" height="40" rx="4" fill="#E8483D"/>
        <rect x="-4" y="-14" width="24" height="16" rx="4" fill="#2D2A26"/>
      </g>
      <text x="110" y="175" text-anchor="middle" font-weight="700" font-size="16">Kaca</text>
      <text x="110" y="196" text-anchor="middle" font-size="11" fill="#7A6F63">窓ガラス</text>
      <text x="110" y="216" text-anchor="middle" font-size="11" fill="#4A433C">Semprot &amp; lap dengan</text>
      <text x="110" y="233" text-anchor="middle" font-size="11" fill="#4A433C">kain microfiber</text>
    </g>

    <!-- Meja/counter -->
    <g transform="translate(540,90)">
      <rect width="220" height="230" rx="18" fill="#FFFFFF" stroke="#FF8A5B" stroke-width="3"/>
      <rect x="65" y="70" width="90" height="14" rx="4" fill="#B98A5A"/>
      <rect x="75" y="84" width="10" height="30" fill="#B98A5A"/>
      <rect x="135" y="84" width="10" height="30" fill="#B98A5A"/>
      <rect x="150" y="40" width="14" height="36" rx="4" fill="#3BA776"/>
      <rect x="146" y="30" width="22" height="12" rx="3" fill="#2D2A26"/>
      <path d="M60 55 q10 -10 20 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <rect x="50" y="55" width="40" height="20" rx="6" fill="#F2A93B"/>
      <text x="110" y="175" text-anchor="middle" font-weight="700" font-size="16">Meja/Counter</text>
      <text x="110" y="196" text-anchor="middle" font-size="11" fill="#7A6F63">テーブル・カウンター</text>
      <text x="110" y="216" text-anchor="middle" font-size="11" fill="#4A433C">Lap dengan disinfektan</text>
      <text x="110" y="233" text-anchor="middle" font-size="11" fill="#4A433C">setiap selesai digunakan</text>
    </g>
  </g>
</svg>
