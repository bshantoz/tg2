<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#FFF8F0"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#2D2A26">8 Alergen Wajib Label</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#7A6F63">特定原材料8品目</text>

  <!-- grid 4x2, cards 180x140, gap 12, start x=20 y=80 -->
  <g font-size="12" fill="#2D2A26">
    <!-- 1 Udang -->
    <g transform="translate(20,80)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <path d="M90 45 q22 -18 30 5 q4 14 -12 20 q-18 6 -22 -8 q-3 -10 4 -17" fill="#F2A93B" stroke="#C9791C" stroke-width="2"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Udang</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">えび / 海老</text>
    </g>
    <!-- 2 Kepiting -->
    <g transform="translate(212,80)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <ellipse cx="90" cy="48" rx="26" ry="16" fill="#E8483D"/>
      <path d="M64 44 l-14 -10 M116 44 l14 -10 M70 60 l-10 14 M110 60 l10 14" stroke="#E8483D" stroke-width="4" stroke-linecap="round"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Kepiting</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">かに / 蟹</text>
    </g>
    <!-- 3 Kenari -->
    <g transform="translate(404,80)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <circle cx="90" cy="50" r="24" fill="#B98A5A"/>
      <path d="M90 30 v40 M74 50 q16 -10 32 0 M74 50 q16 10 32 0" stroke="#8C6239" stroke-width="2" fill="none"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Kenari</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">くるみ / 胡桃</text>
    </g>
    <!-- 4 Gandum -->
    <g transform="translate(596,80)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <path d="M90 30 v40" stroke="#C9791C" stroke-width="3"/>
      <ellipse cx="90" cy="34" rx="6" ry="10" fill="#F2A93B"/>
      <ellipse cx="80" cy="42" rx="6" ry="10" fill="#F2A93B" transform="rotate(-30 80 42)"/>
      <ellipse cx="100" cy="42" rx="6" ry="10" fill="#F2A93B" transform="rotate(30 100 42)"/>
      <ellipse cx="80" cy="54" rx="6" ry="10" fill="#F2A93B" transform="rotate(-30 80 54)"/>
      <ellipse cx="100" cy="54" rx="6" ry="10" fill="#F2A93B" transform="rotate(30 100 54)"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Gandum</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">小麦</text>
    </g>
    <!-- 5 Soba -->
    <g transform="translate(20,240)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <ellipse cx="70" cy="45" rx="14" ry="10" fill="#B98A5A"/>
      <ellipse cx="95" cy="52" rx="14" ry="10" fill="#8C6239"/>
      <ellipse cx="112" cy="38" rx="14" ry="10" fill="#B98A5A"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Soba</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">そば / 蕎麦</text>
    </g>
    <!-- 6 Telur -->
    <g transform="translate(212,240)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <ellipse cx="90" cy="50" rx="20" ry="26" fill="#FFF3D6" stroke="#F2A93B" stroke-width="3"/>
      <circle cx="90" cy="52" r="9" fill="#F2A93B"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Telur</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">卵 / たまご</text>
    </g>
    <!-- 7 Susu -->
    <g transform="translate(404,240)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <path d="M78 24 h24 v10 l6 8 v34 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-34 l6 -8 z" fill="#FFFFFF" stroke="#3BA776" stroke-width="3"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Susu</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">乳 / ミルク</text>
    </g>
    <!-- 8 Kacang tanah -->
    <g transform="translate(596,240)">
      <rect width="180" height="140" rx="16" fill="#FFFFFF" stroke="#FFB08A" stroke-width="3"/>
      <ellipse cx="80" cy="40" rx="14" ry="18" fill="#D9A05B"/>
      <ellipse cx="100" cy="60" rx="14" ry="18" fill="#D9A05B"/>
      <text x="90" y="95" text-anchor="middle" font-weight="700" font-size="13">Kacang Tanah</text>
      <text x="90" y="112" text-anchor="middle" font-size="11" fill="#7A6F63">落花生</text>
    </g>
  </g>
</svg>
