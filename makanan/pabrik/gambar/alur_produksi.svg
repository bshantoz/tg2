<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F2F7F8"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#22313A">Alur Produksi Pabrik Makanan</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7480">食品製造の流れ</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3E8E9E"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#22313A">
    <!-- Step 1 x=24 -->
    <g transform="translate(24,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <path d="M46 30 h20 M46 25 l6 -8 h8 l6 8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Penerimaan</text>
      <text x="56" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Bahan Baku</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">原材料受入</text>
    </g>
    <line x1="136" y1="155" x2="150" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 x=150 -->
    <g transform="translate(150,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <path d="M46 22 h20 v16 h-20 z M50 22 v-5 h12 v5" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Pengolahan</text>
      <text x="56" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Awal</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">下処理</text>
    </g>
    <line x1="262" y1="155" x2="276" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 x=276 -->
    <g transform="translate(276,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <path d="M46 36 q0 -14 10 -14 q3 -8 10 -4 q7 -4 10 6 q6 0 6 8 q0 4 -4 4 h-28 q-4 0 -4 -4" fill="#FFFFFF"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Pemasakan /</text>
      <text x="56" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Pengolahan Utama</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">主加工・加熱</text>
    </g>
    <line x1="388" y1="155" x2="402" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 x=402 -->
    <g transform="translate(402,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <rect x="47" y="22" width="18" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <line x1="47" y1="28" x2="65" y2="28" stroke="#FFFFFF" stroke-width="2"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Pengisian &amp;</text>
      <text x="56" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Pengemasan</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">充填・包装</text>
    </g>
    <line x1="514" y1="155" x2="528" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 5 x=528 -->
    <g transform="translate(528,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <path d="M46 30 l8 8 l16 -18" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Inspeksi</text>
      <text x="56" y="76" text-anchor="middle" font-weight="700" font-size="10.5">Akhir</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">最終検査</text>
    </g>
    <line x1="640" y1="155" x2="654" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 6 x=654 -->
    <g transform="translate(654,95)">
      <rect width="112" height="120" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="56" cy="30" r="16" fill="#2E6E82"/>
      <rect x="42" y="26" width="20" height="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M62 28 h8 l4 6 v4 h-12 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="49" cy="40" r="2.5" fill="#FFFFFF"/>
      <circle cx="68" cy="40" r="2.5" fill="#FFFFFF"/>
      <text x="56" y="62" text-anchor="middle" font-weight="700" font-size="10.5">Pengiriman</text>
      <text x="56" y="94" text-anchor="middle" font-size="9.5" fill="#5C7480">出荷</text>
    </g>
  </g>
</svg>
