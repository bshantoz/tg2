<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="320" fill="#F2F7F8"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#22313A">Titik Inspeksi Penerimaan Bahan Baku</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7480">原材料受入検査ポイント</text>

  <defs>
    <marker id="ti" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3E8E9E"/>
    </marker>
  </defs>

  <g font-size="11" fill="#22313A">
    <!-- Truck -->
    <g transform="translate(20,120)">
      <rect x="0" y="10" width="70" height="36" rx="4" fill="#2E6E82"/>
      <rect x="70" y="22" width="30" height="24" rx="3" fill="#3E8E9E"/>
      <rect x="76" y="27" width="14" height="10" fill="#DFF0F1"/>
      <circle cx="24" cy="50" r="9" fill="#22313A"/>
      <circle cx="24" cy="50" r="3.5" fill="#B9C9CE"/>
      <circle cx="86" cy="50" r="9" fill="#22313A"/>
      <circle cx="86" cy="50" r="3.5" fill="#B9C9CE"/>
      <text x="50" y="72" text-anchor="middle" font-weight="700" font-size="11">Truk Kiriman</text>
      <text x="50" y="86" text-anchor="middle" font-size="9.5" fill="#5C7480">納品トラック</text>
    </g>

    <line x1="128" y1="155" x2="150" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ti)"/>

    <!-- Checkpoint 1: Cek Suhu -->
    <g transform="translate(155,90)">
      <rect width="150" height="130" rx="16" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="75" cy="35" r="18" fill="#2E6E82"/>
      <rect x="71" y="22" width="8" height="20" rx="4" fill="#FFFFFF"/>
      <circle cx="75" cy="44" r="6" fill="#FFFFFF"/>
      <text x="75" y="80" text-anchor="middle" font-weight="700" font-size="12">Cek Suhu</text>
      <text x="75" y="97" text-anchor="middle" font-size="10" fill="#5C7480">温度確認</text>
      <text x="75" y="116" text-anchor="middle" font-size="9.5" fill="#4A5A62">Checkpoint 1</text>
    </g>

    <line x1="305" y1="155" x2="327" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ti)"/>

    <!-- Checkpoint 2: Cek Dokumen -->
    <g transform="translate(332,90)">
      <rect width="150" height="130" rx="16" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="75" cy="35" r="18" fill="#2E6E82"/>
      <rect x="66" y="25" width="18" height="22" rx="2" fill="#FFFFFF"/>
      <line x1="70" y1="31" x2="80" y2="31" stroke="#2E6E82" stroke-width="1.5"/>
      <line x1="70" y1="36" x2="80" y2="36" stroke="#2E6E82" stroke-width="1.5"/>
      <path d="M69 42 l3 3 l6 -7" stroke="#3BA776" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="75" y="80" text-anchor="middle" font-weight="700" font-size="12">Cek Dokumen</text>
      <text x="75" y="97" text-anchor="middle" font-size="10" fill="#5C7480">書類確認</text>
      <text x="75" y="116" text-anchor="middle" font-size="9.5" fill="#4A5A62">Checkpoint 2</text>
    </g>

    <line x1="482" y1="155" x2="504" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ti)"/>

    <!-- Checkpoint 3: Cek Kemasan -->
    <g transform="translate(509,90)">
      <rect width="150" height="130" rx="16" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <circle cx="75" cy="35" r="18" fill="#2E6E82"/>
      <rect x="65" y="26" width="20" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <line x1="65" y1="32" x2="85" y2="32" stroke="#FFFFFF" stroke-width="2"/>
      <text x="75" y="80" text-anchor="middle" font-weight="700" font-size="12">Cek Kemasan</text>
      <text x="75" y="97" text-anchor="middle" font-size="10" fill="#5C7480">包装確認</text>
      <text x="75" y="116" text-anchor="middle" font-size="9.5" fill="#4A5A62">Checkpoint 3</text>
    </g>

    <line x1="659" y1="155" x2="681" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#ti)"/>

    <!-- Warehouse -->
    <g transform="translate(686,110)">
      <path d="M0 30 L45 5 L90 30 V90 H0 Z" fill="#FFFFFF" stroke="#2E6E82" stroke-width="3"/>
      <rect x="18" y="50" width="20" height="40" fill="#7FB6B0"/>
      <rect x="52" y="50" width="20" height="40" fill="#7FB6B0"/>
      <text x="45" y="105" text-anchor="middle" font-weight="700" font-size="11">Gudang</text>
      <text x="45" y="120" text-anchor="middle" font-size="9.5" fill="#5C7480">倉庫</text>
    </g>
  </g>
</svg>
