<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="340" fill="#F2F7F8"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#22313A">Diagram HACCP Pabrik</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7480">HACCP工程管理図（CCP）</text>

  <defs>
    <marker id="hc" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3E8E9E"/>
    </marker>
  </defs>

  <g font-size="10" fill="#22313A">
    <!-- 6 steps, w=112, gap=14, start=24 -->
    <!-- 1 Penerimaan -->
    <g transform="translate(24,110)">
      <rect width="112" height="90" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <text x="56" y="40" text-anchor="middle" font-weight="700" font-size="10.5">Penerimaan</text>
      <text x="56" y="56" text-anchor="middle" font-size="9" fill="#5C7480">受入</text>
    </g>
    <line x1="136" y1="155" x2="150" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#hc)"/>

    <!-- 2 Pengolahan awal -->
    <g transform="translate(150,110)">
      <rect width="112" height="90" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <text x="56" y="40" text-anchor="middle" font-weight="700" font-size="10.5">Pengolahan</text>
      <text x="56" y="54" text-anchor="middle" font-weight="700" font-size="10.5">Awal</text>
      <text x="56" y="70" text-anchor="middle" font-size="9" fill="#5C7480">下処理</text>
    </g>
    <line x1="262" y1="155" x2="276" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#hc)"/>

    <!-- 3 Pemanasan - CCP -->
    <g transform="translate(276,90)">
      <rect width="112" height="130" rx="14" fill="#FFF3E0" stroke="#D9534F" stroke-width="4"/>
      <path d="M56 12 l10 16 h-20 z" fill="#D9534F"/>
      <text x="56" y="24" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">!</text>
      <text x="56" y="60" text-anchor="middle" font-weight="700" font-size="10.5">Pemanasan</text>
      <text x="56" y="76" text-anchor="middle" font-size="9" fill="#5C7480">加熱</text>
      <rect x="18" y="88" width="76" height="20" rx="10" fill="#D9534F"/>
      <text x="56" y="102" text-anchor="middle" font-size="9.5" fill="#FFFFFF" font-weight="700">CCP</text>
      <text x="56" y="120" text-anchor="middle" font-size="8.5" fill="#8A2E2A">Titik Kendali Kritis</text>
    </g>
    <line x1="388" y1="155" x2="402" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#hc)"/>

    <!-- 4 Pendinginan cepat - CCP -->
    <g transform="translate(402,90)">
      <rect width="112" height="130" rx="14" fill="#FFF3E0" stroke="#D9534F" stroke-width="4"/>
      <path d="M56 12 l10 16 h-20 z" fill="#D9534F"/>
      <text x="56" y="24" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">!</text>
      <text x="56" y="56" text-anchor="middle" font-weight="700" font-size="10">Pendinginan</text>
      <text x="56" y="70" text-anchor="middle" font-weight="700" font-size="10">Cepat</text>
      <text x="56" y="84" text-anchor="middle" font-size="9" fill="#5C7480">急速冷却</text>
      <rect x="18" y="94" width="76" height="20" rx="10" fill="#D9534F"/>
      <text x="56" y="108" text-anchor="middle" font-size="9.5" fill="#FFFFFF" font-weight="700">CCP</text>
      <text x="56" y="126" text-anchor="middle" font-size="8.5" fill="#8A2E2A">Titik Kendali Kritis</text>
    </g>
    <line x1="514" y1="155" x2="528" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#hc)"/>

    <!-- 5 Deteksi benda asing - CCP -->
    <g transform="translate(528,90)">
      <rect width="112" height="130" rx="14" fill="#FFF3E0" stroke="#D9534F" stroke-width="4"/>
      <path d="M56 12 l10 16 h-20 z" fill="#D9534F"/>
      <text x="56" y="24" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="700">!</text>
      <text x="56" y="56" text-anchor="middle" font-weight="700" font-size="9.5">Deteksi Benda</text>
      <text x="56" y="70" text-anchor="middle" font-weight="700" font-size="9.5">Asing</text>
      <text x="56" y="84" text-anchor="middle" font-size="9" fill="#5C7480">異物検出</text>
      <rect x="18" y="94" width="76" height="20" rx="10" fill="#D9534F"/>
      <text x="56" y="108" text-anchor="middle" font-size="9.5" fill="#FFFFFF" font-weight="700">CCP</text>
      <text x="56" y="126" text-anchor="middle" font-size="8.5" fill="#8A2E2A">Titik Kendali Kritis</text>
    </g>
    <line x1="640" y1="155" x2="654" y2="155" stroke="#3E8E9E" stroke-width="3" marker-end="url(#hc)"/>

    <!-- 6 Pengemasan -->
    <g transform="translate(654,110)">
      <rect width="112" height="90" rx="14" fill="#FFFFFF" stroke="#3E8E9E" stroke-width="3"/>
      <text x="56" y="40" text-anchor="middle" font-weight="700" font-size="10.5">Pengemasan</text>
      <text x="56" y="56" text-anchor="middle" font-size="9" fill="#5C7480">包装</text>
    </g>
  </g>

  <g>
    <rect x="24" y="255" width="18" height="14" rx="3" fill="#D9534F"/>
    <text x="48" y="266" font-size="11" fill="#22313A">= CCP (Critical Control Point) — titik yang wajib dipantau dan dikendalikan secara ketat</text>
    <text x="48" y="284" font-size="10" fill="#5C7480">重要管理点：厳密な監視・管理が必要な工程</text>
  </g>
</svg>
