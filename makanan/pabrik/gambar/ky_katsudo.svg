<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#F2F7F8"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#22313A">Kegiatan KY Katsudo</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#5C7480">危険予知活動（KY活動）</text>

  <!-- Whiteboard/clipboard center -->
  <g transform="translate(310,90)">
    <rect width="180" height="140" rx="10" fill="#FFFFFF" stroke="#2E6E82" stroke-width="4"/>
    <rect x="70" y="-14" width="40" height="20" rx="4" fill="#2E6E82"/>
    <text x="90" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#22313A">Bahaya Hari Ini</text>
    <text x="90" y="40" text-anchor="middle" font-size="9.5" fill="#5C7480">本日の危険予知</text>
    <!-- hazard icons on board -->
    <path d="M32 58 l9 15 h-18 z" fill="#D9534F"/>
    <text x="32" y="56" text-anchor="middle" font-size="8" fill="#D9534F" font-weight="700"> </text>
    <text x="32" y="86" text-anchor="middle" font-size="8" fill="#4A5A62">Lantai licin</text>

    <circle cx="90" cy="65" r="10" fill="#F2A93B"/>
    <path d="M84 65 h12" stroke="#FFFFFF" stroke-width="2"/>
    <text x="90" y="86" text-anchor="middle" font-size="8" fill="#4A5A62">Mesin panas</text>

    <rect x="138" y="58" width="18" height="14" rx="2" fill="#3E8E9E"/>
    <text x="147" y="86" text-anchor="middle" font-size="8" fill="#4A5A62">Titik jepit</text>

    <line x1="20" y1="100" x2="160" y2="100" stroke="#DDE7E8" stroke-width="1.5"/>
    <text x="90" y="118" text-anchor="middle" font-size="9" fill="#22313A" font-weight="700">Langkah Pencegahan:</text>
    <text x="90" y="132" text-anchor="middle" font-size="8" fill="#4A5A62">Pakai APD, cek mesin,</text>
    <text x="90" y="145" text-anchor="middle" font-size="8" fill="#4A5A62">jaga jarak aman</text>
  </g>

  <!-- Team huddled in circle around board, 5 people -->
  <g>
    <!-- person 1 bottom left -->
    <g transform="translate(150,300)">
      <circle cx="0" cy="0" r="16" fill="#2E6E82"/>
      <path d="M-22 40 q22 -30 44 0 z" fill="#3E8E9E"/>
    </g>
    <!-- person 2 left -->
    <g transform="translate(230,260)">
      <circle cx="0" cy="0" r="16" fill="#3E8E9E"/>
      <path d="M-22 40 q22 -30 44 0 z" fill="#7FB6B0"/>
    </g>
    <!-- person 3 top center -->
    <g transform="translate(400,240)">
      <circle cx="0" cy="0" r="16" fill="#2E6E82"/>
      <path d="M-22 40 q22 -30 44 0 z" fill="#3E8E9E"/>
    </g>
    <!-- person 4 right -->
    <g transform="translate(570,260)">
      <circle cx="0" cy="0" r="16" fill="#3E8E9E"/>
      <path d="M-22 40 q22 -30 44 0 z" fill="#7FB6B0"/>
    </g>
    <!-- person 5 bottom right -->
    <g transform="translate(650,300)">
      <circle cx="0" cy="0" r="16" fill="#2E6E82"/>
      <path d="M-22 40 q22 -30 44 0 z" fill="#3E8E9E"/>
    </g>
  </g>

  <g font-size="13" fill="#22313A">
    <text x="400" y="380" text-anchor="middle" font-weight="700" font-size="14">Tim shift berkumpul sebelum kerja</text>
    <text x="400" y="400" text-anchor="middle" font-size="11" fill="#5C7480">作業前のミーティングで危険を予知し、対策を話し合う</text>
  </g>
</svg>
