<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Noto Sans JP','Hiragino Sans',sans-serif">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#17324a"/></marker>
  <marker id="arrowM" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5c6b78"/></marker>
</defs>
<rect x="0" y="0" width="900" height="560" rx="24" fill="#f7f9fb"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#17324a">Kecelakaan yang Paling Sering Terjadi</text>
<text x="40" y="76" font-size="14" fill="#5c6b78">三大災害 &#8212; diurutkan dari yang paling sering (bukan data persentase resmi)</text>
<rect x="100.0" y="110" width="700.0" height="80" rx="12" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="2"/><circle cx="132.0" cy="150.0" r="18" fill="#c0392b"/><text x="132.0" y="156.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="164.0" y="142" font-size="18" font-weight="700" fill="#17324a">墜落・転落 <tspan font-size="13.5" font-weight="600" fill="#c0392b">&#183; Jatuh dari ketinggian</tspan></text><text x="164.0" y="164" font-size="12.5" fill="#5c6b78">Paling sering di antara tiga besar — saat kerja di tempat tinggi</text><rect x="163.33333333333331" y="206" width="573.3333333333334" height="80" rx="12" fill="#c07a1b" opacity="0.12" stroke="#c07a1b" stroke-width="2"/><circle cx="195.33333333333331" cy="246.0" r="18" fill="#c07a1b"/><text x="195.33333333333331" y="252.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="227.33333333333331" y="238" font-size="18" font-weight="700" fill="#17324a">建設機械・クレーンなど災害 <tspan font-size="13.5" font-weight="600" fill="#c07a1b">&#183; Kecelakaan alat berat / crane</tspan></text><text x="227.33333333333331" y="260" font-size="12.5" fill="#5c6b78">Termasuk tertabrak alat &amp; terjepit/tergulung</text><rect x="226.66666666666666" y="302" width="446.6666666666667" height="80" rx="12" fill="#2f7fc4" opacity="0.12" stroke="#2f7fc4" stroke-width="2"/><circle cx="258.66666666666663" cy="342.0" r="18" fill="#2f7fc4"/><text x="258.66666666666663" y="348.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="290.66666666666663" y="334" font-size="18" font-weight="700" fill="#17324a">崩壊・倒壊災害 <tspan font-size="13.5" font-weight="600" fill="#2f7fc4">&#183; Longsor / robohnya struktur</tspan></text><text x="290.66666666666663" y="356" font-size="12.5" fill="#5c6b78">Bagian dari tiga kecelakaan besar (三大災害)</text><rect x="290.0" y="398" width="320.0" height="80" rx="12" fill="#5c6b78" opacity="0.12" stroke="#5c6b78" stroke-width="2"/><circle cx="322.0" cy="438.0" r="18" fill="#5c6b78"/><text x="322.0" y="444.0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="354.0" y="430" font-size="18" font-weight="700" fill="#17324a">交通事故 <tspan font-size="13.5" font-weight="600" fill="#5c6b78">&#183; Kecelakaan lalu lintas</tspan></text><text x="354.0" y="452" font-size="12.5" fill="#5c6b78">Di luar tiga besar, tapi tinggi — saat berpindah ke lokasi kerja</text><text x="450.0" y="510" text-anchor="middle" font-size="12.5" fill="#5c6b78">Sumber: ringkasan materi &#8212; 三大災害 menyumbang 40&#8211;70% dari total kecelakaan kerja konstruksi.</text></svg>