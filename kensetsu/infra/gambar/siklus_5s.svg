<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <title id="t">Siklus 5S</title>
  <desc id="d">Lima langkah melingkar: memilah, menata, membersihkan, menjaga kebersihan, dan disiplin.</desc>
  <rect width="700" height="700" rx="16" fill="#f7f9fb"/>
  <text x="32" y="42" font-size="20" font-weight="700" fill="#16202a">Siklus 5S</text>
  <text x="32" y="64" font-size="14" fill="#4a5966" font-style="italic">Go-esu katsudō · ５S活動</text>

  <circle cx="350" cy="390" r="230" fill="none" stroke="#d5dde5" stroke-width="2" stroke-dasharray="2 8"/>

  <!-- 5 node melingkar -->
  <g font-family="inherit">
    <!-- node 1: atas -->
    <circle cx="350" cy="160" r="58" fill="#1f5fa8"/>
    <text x="350" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">整理</text>
    <text x="350" y="174" text-anchor="middle" font-size="11" fill="#dbe9fb">Seiri</text>

    <!-- node 2: kanan atas -->
    <circle cx="551" cy="299" r="58" fill="#1b8a6b"/>
    <text x="551" y="291" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">整頓</text>
    <text x="551" y="313" text-anchor="middle" font-size="11" fill="#d8f3e6">Seiton</text>

    <!-- node 3: kanan bawah -->
    <circle cx="475" cy="533" r="58" fill="#d98b0c"/>
    <text x="475" y="525" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">清掃</text>
    <text x="475" y="547" text-anchor="middle" font-size="11" fill="#fdecc9">Seisō</text>

    <!-- node 4: kiri bawah -->
    <circle cx="225" cy="533" r="58" fill="#a3541f"/>
    <text x="225" y="525" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">清潔</text>
    <text x="225" y="547" text-anchor="middle" font-size="11" fill="#f1dcc9">Seiketsu</text>

    <!-- node 5: kiri atas -->
    <circle cx="149" cy="299" r="58" fill="#7a3fa0"/>
    <text x="149" y="291" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">しつけ</text>
    <text x="149" y="313" text-anchor="middle" font-size="11" fill="#e9d9f2">Shitsuke</text>
  </g>

  <!-- panah siklus antar node -->
  <g fill="none" stroke="#8b97a3" stroke-width="3" marker-end="url(#arrow)">
    <path d="M395,190 A230,230 0 0 1 508,258"/>
    <path d="M545,353 A230,230 0 0 1 512,481"/>
    <path d="M424,553 A230,230 0 0 1 276,553"/>
    <path d="M188,481 A230,230 0 0 1 155,353"/>
    <path d="M192,258 A230,230 0 0 1 305,190"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b97a3"/>
    </marker>
  </defs>

  <!-- keterangan -->
  <g font-size="13" fill="#16202a">
    <text x="350" y="660" text-anchor="middle" font-weight="700">Memilah &#8226; Menata &#8226; Membersihkan &#8226; Menjaga kebersihan &#8226; Disiplin</text>
    <text x="350" y="680" text-anchor="middle" fill="#4a5966">Dilakukan berulang, bukan sekali jadi &#8212; membangun kebiasaan lokasi kerja</text>
  </g>
</svg>
