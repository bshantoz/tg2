<rect x="40" y="110" width="820" height="114" rx="14" fill="#ffffff" stroke="#c7d2da" stroke-width="1.5"/><circle cx="90" cy="167.0" r="34" fill="#c0392b" opacity="0.14"/><g transform="translate(90,167.0)"><path d="M0 -22 L10 -22 L2 -2 L14 -2 L-8 26 L-2 2 L-12 2 Z" fill="#c0392b"/></g><text x="140" y="140" font-size="17" font-weight="700" fill="#17324a">電気設備工事 <tspan font-size="13" font-weight="600" fill="#c0392b">&#183; Instalasi listrik</tspan></text><circle cx="146" cy="157" r="3" fill="#c0392b"/><text x="156" y="162" font-size="12.5" fill="#5c6b78">感電死 — saat potong kabel bertegangan / sentuh perangkat bocor</text><circle cx="146" cy="181" r="3" fill="#c0392b"/><text x="156" y="186" font-size="12.5" fill="#5c6b78">Risiko jatuh saat kerja di tiang listrik</text><rect x="40" y="244" width="820" height="90" rx="14" fill="#ffffff" stroke="#c7d2da" stroke-width="1.5"/><circle cx="90" cy="289.0" r="34" fill="#c07a1b" opacity="0.14"/><g transform="translate(90,289.0)"><rect x="-20" y="-14" width="40" height="28" rx="4" fill="none" stroke="#c07a1b" stroke-width="4"/><circle cx="-10" cy="16" r="6" fill="none" stroke="#c07a1b" stroke-width="3.5"/><circle cx="10" cy="16" r="6" fill="none" stroke="#c07a1b" stroke-width="3.5"/></g><text x="140" y="274" font-size="17" font-weight="700" fill="#17324a">機械設置工事 <tspan font-size="13" font-weight="600" fill="#c07a1b">&#183; Pemasangan mesin</tspan></text><circle cx="146" cy="291" r="3" fill="#c07a1b"/><text x="156" y="296" font-size="12.5" fill="#5c6b78">Tertimpa mesin besar yang terguling saat pemasangan</text><rect x="40" y="354" width="820" height="138" rx="14" fill="#ffffff" stroke="#c7d2da" stroke-width="1.5"/><circle cx="90" cy="423.0" r="34" fill="#0b5cad" opacity="0.14"/><g transform="translate(90,423.0)"><path d="M-22 -10 L22 -10 L14 18 L-14 18 Z" fill="none" stroke="#0b5cad" stroke-width="4" stroke-linejoin="round"/><line x1="-16" y1="-10" x2="-10" y2="18" stroke="#0b5cad" stroke-width="2" stroke-dasharray="2 3"/><line x1