  <g>
    <rect x="60" y="226" width="680" height="46" rx="10" fill="#1E7A72"/>
    <text x="400" y="245" text-anchor="middle" font-size="11.5" font-weight="700" fill="#EDF7F6">Teknik disesuaikan dengan jenis &amp; kondisi material lantai</text>
    <text x="400" y="262" text-anchor="middle" font-size="10.5" fill="#F6DDB0">床材・状態に応じた清掃技術を選ぶ</text>
  </g>
