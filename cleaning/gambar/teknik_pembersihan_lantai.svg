<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#EDF7F6"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1E7A72">Teknik Pembersihan Lantai</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#E8A33D">床の清掃技術</text>
  <g font-size="10.5" fill="#2E2620">
    <g transform="translate(90,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <path d="M70 14 v20" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 34 q12 -4 24 0 q-2 8 -12 8 q-10 0 -12 -8 z" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Dry &amp; Wet Mopping</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">ドライ・ウェットモップ</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Teknik pel kering</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">dan basah</text>
    </g>
    <g transform="translate(250,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <rect x="56" y="18" width="28" height="24" rx="2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 18 v24 M56 30 h28" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Jenis Lantai</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">床材の種類</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Keramik, vinyl,</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">marmer, kayu</text>
    </g>
    <g transform="translate(410,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <ellipse cx="70" cy="41" rx="14" ry="4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 41 v-21" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 20 h16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Polishing &amp; Buffing</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">ポリッシング</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Mengembalikan</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">kilap permukaan</text>
    </g>
    <g transform="translate(570,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <path d="M70 15 l15 27 h-30 z" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 23 v10 M70 37 v2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Tanda Peringatan</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">警告表示（濡れ床）</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Wet floor sign</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">cegah kecelakaan</text>
