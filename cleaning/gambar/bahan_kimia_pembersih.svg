<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#EDF7F6"/>
  <text x="400" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1E7A72">Bahan Kimia Pembersih</text>
  <text x="400" y="58" text-anchor="middle" font-size="14" fill="#E8A33D">洗浄剤・化学薬品</text>
  <g font-size="10.5" fill="#2E2620">
    <g transform="translate(90,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <rect x="63" y="20" width="14" height="22" rx="2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="14" width="8" height="6" rx="1" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 29 h8" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Jenis Bahan Kimia</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">洗剤の種類</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Asam, basa, netral,</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">dan disinfektan</text>
    </g>
    <g transform="translate(250,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <circle cx="70" cy="30" r="10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 30 l6 -6" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="30" r="1.4" fill="#FFFFFF"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Konsep pH</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">pH（水素イオン指数）</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Skala keasaman</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">bahan pembersih</text>
    </g>
    <g transform="translate(410,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <path d="M70 16 q11 14 0 23 q-11 -9 0 -23 z" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Dosis &amp; Pengenceran</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">希釈・使用量</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Takaran tepat</text>
      <text x="70" y="114" text-anchor="middle" font-size="9" fill="#3A5652">sesuai label</text>
    </g>
    <g transform="translate(570,90)">
      <rect width="140" height="120" rx="14" fill="#FFFFFF" stroke="#1E7A72" stroke-width="3"/>
      <circle cx="70" cy="32" r="18" fill="#155C56"/>
      <path d="M70 15 l15 27 h-30 z" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 23 v10 M70 37 v2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="66" text-anchor="middle" font-weight="700" font-size="11.5" fill="#123B36">Keamanan Penyimpanan</text>
      <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#E8A33D">保管上の注意</text>
      <text x="70" y="102" text-anchor="middle" font-size="9" fill="#3A5652">Hindari campuran</text>
