<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#5C1F28">Alur Proses Check-in</text>
  <text x="400" y="56" text-anchor="middle" font-size="14" fill="#9B6B2C">チェックイン業務</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#2E2620">
    <!-- Step 1 -->
    <g transform="translate(30,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <circle cx="82" cy="26" r="6" fill="#FFFFFF"/>
      <path d="M70 42 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <path d="M92 20 q6 0 6 6" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Sambutan</text>
      <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">出迎え・あいさつ</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.5">「いらっしゃいませ」</text>
      <text x="82" y="115" text-anchor="middle" font-size="8.3">senyum &amp; kontak mata</text>
    </g>
    <line x1="194" y1="160" x2="212" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 -->
    <g transform="translate(212,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <rect x="72" y="22" width="20" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M75 32 l4 4 l9 -10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Konfirmasi</text>
      <text x="82" y="82" text-anchor="middle" font-weight="700" font-size="11">Reservasi</text>
      <text x="82" y="98" text-anchor="middle" font-size="9.5" fill="#8A5A2E">予約内容の確認</text>
      <text x="82" y="114" text-anchor="middle" font-size="8.3">cocokkan nama &amp; identitas</text>
    </g>
    <line x1="376" y1="160" x2="394" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 -->
    <g transform="translate(394,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <rect x="70" y="20" width="24" height="24" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="74" y1="26" x2="90" y2="26" stroke="#FFFFFF" stroke-width="1.6"/>
      <line x1="74" y1="32" x2="90" y2="32" stroke="#FFFFFF" stroke-width="1.6"/>
      <line x1="74" y1="38" x2="84" y2="38" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Pendaftaran</text>
      <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">宿帳・台帳登録</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.5">shukuhaku daichō</text>
      <text x="82" y="115" text-anchor="middle" font-size="8.3">+ dokumen legal</text>
    </g>
    <line x1="558" y1="160" x2="576" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 -->
    <g transform="translate(576,95)">
      <rect width="194" height="130" rx="14" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="90" cy="32" r="17" fill="#8A2E3B"/>
      <circle cx="83" cy="32" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <line x1="90" y1="32" x2="100" y2="32" stroke="#FFFFFF" stroke-width="2.2"/>
      <line x1="96" y1="32" x2="96" y2="27" stroke="#FFFFFF" stroke-width="2.2"/>
      <text x="97" y="68" text-anchor="middle" font-weight="700" font-size="11">Serah Kunci &amp;</text>
      <text x="97" y="82" text-anchor="middle" font-weight="700" font-size="11">Penjelasan Fasilitas</text>
      <text x="97" y="98" text-anchor="middle" font-size="9.5" fill="#8A5A2E">ルームキーのお渡し</text>
      <text x="97" y="114" text-anchor="middle" font-size="8.3">denah gedung &amp; pintu darurat</text>
    </g>
  </g>

  <text x="400" y="270" text-anchor="middle" font-size="9.5" fill="#5C1F28">Waktu standar check-in: 14:00–15:00（dapat berbeda tiap fasilitas）</text>
</svg>
