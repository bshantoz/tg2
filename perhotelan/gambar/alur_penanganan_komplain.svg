<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#5C1F28">Alur Penanganan Komplain</text>
  <text x="400" y="56" text-anchor="middle" font-size="14" fill="#9B6B2C">クレーム（苦情）対応</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#2E2620">
    <!-- Step 1 -->
    <g transform="translate(30,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <path d="M74 28 q8 -8 16 0" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="82" cy="38" r="2" fill="#FFFFFF"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Minta Maaf</text>
      <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">謝罪（shazai）</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.3">「申し訳ございません」</text>
      <text x="82" y="115" text-anchor="middle" font-size="8">tanpa menyalahkan tamu</text>
    </g>
    <line x1="194" y1="160" x2="212" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 -->
    <g transform="translate(212,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <circle cx="78" cy="28" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="84" y1="34" x2="90" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Verifikasi Fakta</text>
      <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">事実確認</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.3">dengarkan kronologi,</text>
      <text x="82" y="115" text-anchor="middle" font-size="8">jangan memotong tamu</text>
    </g>
    <line x1="376" y1="160" x2="394" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 -->
    <g transform="translate(394,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <circle cx="82" cy="26" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="82" y1="33" x2="82" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Tawarkan Solusi</text>
      <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">解決策の提示</text>
      <text x="82" y="102" text-anchor="middle" font-size="8.3">sesuai wewenang; di</text>
      <text x="82" y="115" text-anchor="middle" font-size="8">luar itu → lapor atasan</text>
    </g>
    <line x1="558" y1="160" x2="576" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 -->
    <g transform="translate(576,95)">
      <rect width="194" height="130" rx="14" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="90" cy="32" r="17" fill="#8A2E3B"/>
      <rect x="80" y="22" width="20" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="83" y1="28" x2="97" y2="28" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="83" y1="33" x2="97" y2="33" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="83" y1="38" x2="91" y2="38" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="97" y="68" text-anchor="middle" font-weight="700" font-size="11">Laporkan &amp; Catat</text>
      <text x="97" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">報告・記録</text>
      <text x="97" y="102" text-anchor="middle" font-size="8.3">detail ke supervisor /</text>
      <text x="97" y="115" text-anchor="middle" font-size="8">tim, cegah kejadian ulang</text>
    </g>
  </g>

  <text x="400" y="270" text-anchor="middle" font-size="9.5" fill="#5C1F28">Prinsip yang sama berlaku di penanganan telepon: bicara jelas, ulangi konfirmasi</text>
</svg>
