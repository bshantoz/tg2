<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#5C1F28">Peta Layanan Dalam Hotel</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">館内でのお客様対応と情報提供</text>

  <!-- spokes -->
  <g stroke="#9B6B2C" stroke-width="2.5" fill="none" stroke-dasharray="5 4">
    <line x1="400" y1="165" x2="130" y2="90"/>
    <line x1="400" y1="165" x2="400" y2="80"/>
    <line x1="400" y1="165" x2="670" y2="90"/>
    <line x1="400" y1="165" x2="150" y2="250"/>
    <line x1="400" y1="165" x2="650" y2="250"/>
  </g>

  <!-- center: front desk -->
  <g transform="translate(340,140)">
    <rect width="120" height="60" rx="14" fill="#5C1F28"/>
    <text x="60" y="24" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F7F2EA">フロント</text>
    <text x="60" y="40" text-anchor="middle" font-size="9.5" fill="#F0DFC9">Front Desk</text>
    <text x="60" y="53" text-anchor="middle" font-size="8" fill="#F0DFC9">pusat koordinasi</text>
  </g>

  <g font-size="9.3" fill="#2E2620">
    <!-- Doorman -->
    <g transform="translate(60,50)">
      <rect width="140" height="78" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="24" cy="24" r="14" fill="#5C3A17"/>
      <circle cx="24" cy="19" r="4.5" fill="#FFFFFF"/>
      <path d="M15 33 q0 -8 9 -8 q9 0 9 8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="76" y="18" text-anchor="middle" font-weight="700" font-size="10.5">Doorman</text>
      <text x="76" y="31" text-anchor="middle" font-size="8.7" fill="#8A5A2E">ドアマン業務</text>
      <text x="76" y="50" text-anchor="middle" font-size="8">Sambut &amp; antar</text>
      <text x="76" y="61" text-anchor="middle" font-size="8">tamu di pintu masuk</text>
    </g>

    <!-- Housekeeping -->
    <g transform="translate(330,42)">
      <rect width="140" height="70" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="24" cy="24" r="14" fill="#5C3A17"/>
      <rect x="18" y="16" width="12" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="76" y="18" text-anchor="middle" font-weight="700" font-size="10.5">Housekeeping</text>
      <text x="76" y="31" text-anchor="middle" font-size="8.7" fill="#8A5A2E">ハウスキーパー業務</text>
      <text x="76" y="49" text-anchor="middle" font-size="8">Bersihkan kamar &amp;</text>
      <text x="76" y="60" text-anchor="middle" font-size="8">siapkan amenitas</text>
    </g>

    <!-- Concierge -->
    <g transform="translate(600,50)">
      <rect width="140" height="78" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="24" cy="24" r="14" fill="#5C3A17"/>
      <path d="M16 30 l8 -14 l8 14 z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="24" cy="16" r="2" fill="#FFFFFF"/>
      <text x="76" y="18" text-anchor="middle" font-weight="700" font-size="10.5">Concierge</text>
      <text x="76" y="31" text-anchor="middle" font-size="8.7" fill="#8A5A2E">コンシェルジュ業務</text>
      <text x="76" y="50" text-anchor="middle" font-size="8">Info &amp; atur acara /</text>
      <text x="76" y="61" text-anchor="middle" font-size="8">perjalanan tamu</text>
    </g>

    <!-- Nakai -->
    <g transform="translate(80,210)">
      <rect width="140" height="70" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="24" cy="24" r="14" fill="#5C3A17"/>
      <circle cx="24" cy="19" r="4.5" fill="#FFFFFF"/>
      <path d="M15 33 q0 -8 9 -8 q9 0 9 8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="76" y="18" text-anchor="middle" font-weight="700" font-size="10.5">Nakai (Ryokan)</text>
      <text x="76" y="31" text-anchor="middle" font-size="8.7" fill="#8A5A2E">仲居業務</text>
      <text x="76" y="49" text-anchor="middle" font-size="8">Pelayanan menyeluruh</text>
      <text x="76" y="60" text-anchor="middle" font-size="8">untuk tamu ryokan</text>
    </g>

    <!-- Restaurant -->
    <g transform="translate(580,210)">
      <rect width="140" height="70" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="24" cy="24" r="14" fill="#5C3A17"/>
      <path d="M16 16 v10 q0 4 4 4 v6 M20 16 v10 M24 16 v10" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M32 16 v14 q0 3 -2 3 v3" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="76" y="18" text-anchor="middle" font-weight="700" font-size="10.5">Restoran</text>
      <text x="76" y="31" text-anchor="middle" font-size="8.7" fill="#8A5A2E">レストラン</text>
      <text x="76" y="49" text-anchor="middle" font-size="8">Layanan makan &amp;</text>
      <text x="76" y="60" text-anchor="middle" font-size="8">minum tamu</text>
    </g>
  </g>

  <text x="400" y="296" text-anchor="middle" font-size="9" fill="#5C1F28">Front desk menjaga privasi tamu (nomor kamar, jadwal) di semua koordinasi ini</text>
</svg>
