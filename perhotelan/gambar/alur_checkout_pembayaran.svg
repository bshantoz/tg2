<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#5C1F28">Alur Check-out &amp; Pembayaran</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">チェックアウト・会計業務</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <g font-size="9.3" fill="#2E2620">
    <!-- Step 1 -->
    <g transform="translate(26,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <rect x="62" y="21" width="16" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="65" y1="26" x2="75" y2="26" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="65" y1="30" x2="75" y2="30" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.3">Konfirmasi</text>
      <text x="70" y="78" text-anchor="middle" font-weight="700" font-size="10.3">Pemakaian Fasilitas</text>
      <text x="70" y="94" text-anchor="middle" font-size="8.7" fill="#8A5A2E">館内利用の確認</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.8">minibar, pijat, room</text>
      <text x="70" y="119" text-anchor="middle" font-size="7.8">service tercatat benar</text>
    </g>
    <line x1="166" y1="155" x2="180" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 -->
    <g transform="translate(180,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <rect x="60" y="20" width="20" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="64" y1="26" x2="76" y2="26" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="64" y1="31" x2="76" y2="31" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="64" y1="36" x2="72" y2="36" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.3">Terbitkan</text>
      <text x="70" y="78" text-anchor="middle" font-weight="700" font-size="10.3">Rincian Tagihan</text>
      <text x="70" y="94" text-anchor="middle" font-size="8.7" fill="#8A5A2E">請求明細書</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.8">seikyū meisaisho</text>
    </g>
    <line x1="320" y1="155" x2="334" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 -->
    <g transform="translate(334,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <rect x="59" y="23" width="22" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="59" y1="28" x2="81" y2="28" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.3">Pembayaran</text>
      <text x="70" y="81" text-anchor="middle" font-size="8.7" fill="#8A5A2E">会計（かいけい）</text>
      <text x="70" y="97" text-anchor="middle" font-size="7.8">tunai / kartu / e-money</text>
      <text x="70" y="111" text-anchor="middle" font-size="7.8">(budaya tip tak berlaku)</text>
    </g>
    <line x1="474" y1="155" x2="488" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 -->
    <g transform="translate(488,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <path d="M60 22 h20 v18 l-4 -3 l-4 3 l-4 -3 l-4 3 l-4 -3 z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.3">Kuitansi</text>
      <text x="70" y="81" text-anchor="middle" font-size="8.7" fill="#8A5A2E">領収書（ryōshūsho）</text>
      <text x="70" y="97" text-anchor="middle" font-size="7.8">diberikan bila diminta</text>
      <text x="70" y="111" text-anchor="middle" font-size="7.8">宿泊税・入湯税 bila ada</text>
    </g>
    <line x1="628" y1="155" x2="642" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 5 -->
    <g transform="translate(642,90)">
      <rect width="134" height="130" rx="13" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="67" cy="30" r="16" fill="#8A2E3B"/>
      <circle cx="60" cy="30" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M65 33 q4 4 9 1" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="67" y="65" text-anchor="middle" font-weight="700" font-size="10.3">Cek Barang</text>
      <text x="67" y="78" text-anchor="middle" font-weight="700" font-size="10.3">Tertinggal</text>
      <text x="67" y="94" text-anchor="middle" font-size="8.7" fill="#8A5A2E">忘れ物の確認</text>
      <text x="67" y="108" text-anchor="middle" font-size="7.8">wasuremono → lapor</text>
      <text x="67" y="119" text-anchor="middle" font-size="7.8">polisi jika tak diambil</text>
    </g>
  </g>

  <text x="400" y="270" text-anchor="middle" font-size="9" fill="#5C1F28">Indikator kinerja dipantau: OCC（keterisian）・ADR（tarif rata-rata）・RevPAR</text>
</svg>
