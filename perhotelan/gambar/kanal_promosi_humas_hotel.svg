<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#5C1F28">Kanal Promosi &amp; Humas Hotel</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">広報業務（kōhō gyōmu）</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <!-- triangle connections between the 3 nodes, reinforcing each other -->
  <g stroke="#9B6B2C" stroke-width="2.5" fill="none" stroke-dasharray="6 4">
    <path d="M240 130 L400 230" marker-end="url(#ap)"/>
    <path d="M400 230 L560 130" marker-end="url(#ap)"/>
    <path d="M560 110 L240 110" marker-end="url(#ap)"/>
  </g>

  <g font-size="9.8" fill="#2E2620">
    <!-- Website -->
    <g transform="translate(120,68)">
      <rect width="160" height="120" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="80" cy="30" r="17" fill="#5C3A17"/>
      <circle cx="80" cy="30" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M70 30 h20 M80 20 q7 10 0 20 M80 20 q-7 10 0 20" stroke="#FFFFFF" stroke-width="1.4" fill="none"/>
      <text x="80" y="68" text-anchor="middle" font-weight="700" font-size="10.8">Situs Web Resmi</text>
      <text x="80" y="82" text-anchor="middle" font-size="8.8" fill="#8A5A2E">自社ホームページ</text>
      <text x="80" y="100" text-anchor="middle" font-size="8">Info lengkap, foto,</text>
      <text x="80" y="111" text-anchor="middle" font-size="8">reservasi online, SEO</text>
    </g>

    <!-- SNS -->
    <g transform="translate(520,68)">
      <rect width="160" height="120" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="80" cy="30" r="17" fill="#5C3A17"/>
      <circle cx="72" cy="25" r="4" fill="#FFFFFF"/>
      <circle cx="88" cy="25" r="4" fill="#FFFFFF"/>
      <circle cx="80" cy="38" r="4" fill="#FFFFFF"/>
      <line x1="75" y1="27" x2="78" y2="35" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="85" y1="27" x2="82" y2="35" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="80" y="68" text-anchor="middle" font-weight="700" font-size="10.8">Media Sosial (SNS)</text>
      <text x="80" y="82" text-anchor="middle" font-size="8.8" fill="#8A5A2E">SNSの運用</text>
      <text x="80" y="100" text-anchor="middle" font-size="8">Konten rutin, respon</text>
      <text x="80" y="111" text-anchor="middle" font-size="8">cepat, kolaborasi lokal</text>
    </g>

    <!-- Guest reviews -->
    <g transform="translate(320,180)">
      <rect width="160" height="110" rx="14" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="80" cy="30" r="17" fill="#8A2E3B"/>
      <path d="M80 22 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#FFFFFF"/>
      <text x="80" y="58" text-anchor="middle" font-weight="700" font-size="10.8">Ulasan Tamu</text>
      <text x="80" y="72" text-anchor="middle" font-size="8.8" fill="#8A5A2E">お客様の口コミ</text>
      <text x="80" y="90" text-anchor="middle" font-size="8">Umpan balik memperkuat</text>
      <text x="80" y="101" text-anchor="middle" font-size="8">kepercayaan &amp; promosi</text>
    </g>
  </g>

  <text x="400" y="292" text-anchor="middle" font-size="9" fill="#5C1F28">Ketiga kanal saling memperkuat untuk membangun citra dan kepercayaan fasilitas</text>
</svg>
