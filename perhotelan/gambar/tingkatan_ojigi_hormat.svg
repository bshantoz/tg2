<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#5C1F28">Tingkatan Ojigi (Membungkuk Hormat)</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">おじぎの種類</text>

  <g font-size="9.8" fill="#2E2620">
    <!-- Eshaku 15 -->
    <g transform="translate(90,80)">
      <rect width="190" height="185" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <!-- ground line -->
      <line x1="30" y1="150" x2="160" y2="150" stroke="#C9B18C" stroke-width="2"/>
      <!-- figure: head+torso rotated 15deg around hip pivot -->
      <g transform="translate(95,150) rotate(-15)">
        <circle cx="0" cy="-70" r="12" fill="#5C3A17"/>
        <line x1="0" y1="-58" x2="0" y2="-10" stroke="#5C3A17" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="-16" y2="-20" stroke="#5C3A17" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="16" y2="-20" stroke="#5C3A17" stroke-width="5" stroke-linecap="round"/>
      </g>
      <line x1="0" y1="0" x2="0" y2="0"/>
      <!-- legs static -->
      <line x1="88" y1="150" x2="82" y2="188" stroke="#5C3A17" stroke-width="6" stroke-linecap="round"/>
      <line x1="102" y1="150" x2="108" y2="188" stroke="#5C3A17" stroke-width="6" stroke-linecap="round"/>
      <!-- angle arc -->
      <path d="M95 150 L95 110 A40 40 0 0 1 84 113" fill="none" stroke="#9B6B2C" stroke-width="1.4" stroke-dasharray="2 2"/>
      <text x="60" y="120" font-size="9" fill="#8A2E3B" font-weight="700">15°</text>

      <text x="95" y="205" text-anchor="middle" font-weight="700" font-size="11">会釈（eshaku）</text>
      <text x="95" y="220" text-anchor="middle" font-size="8.5" fill="#8A5A2E">~15°</text>
      <text x="95" y="238" text-anchor="middle" font-size="8.3">Berpapasan dengan</text>
      <text x="95" y="250" text-anchor="middle" font-size="8.3">tamu di lorong</text>
    </g>

    <!-- Futsurei 30 -->
    <g transform="translate(305,80)">
      <rect width="190" height="185" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <line x1="30" y1="150" x2="160" y2="150" stroke="#C9B18C" stroke-width="2"/>
      <g transform="translate(95,150) rotate(-30)">
        <circle cx="0" cy="-70" r="12" fill="#5C3A17"/>
        <line x1="0" y1="-58" x2="0" y2="-10" stroke="#5C3A17" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="-16" y2="-20" stroke="#5C3A17" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="16" y2="-20" stroke="#5C3A17" stroke-width="5" stroke-linecap="round"/>
      </g>
      <line x1="88" y1="150" x2="82" y2="188" stroke="#5C3A17" stroke-width="6" stroke-linecap="round"/>
      <line x1="102" y1="150" x2="108" y2="188" stroke="#5C3A17" stroke-width="6" stroke-linecap="round"/>
      <path d="M95 150 L95 110 A40 40 0 0 1 76 117" fill="none" stroke="#9B6B2C" stroke-width="1.4" stroke-dasharray="2 2"/>
      <text x="52" y="122" font-size="9" fill="#8A2E3B" font-weight="700">30°</text>

      <text x="95" y="205" text-anchor="middle" font-weight="700" font-size="11">普通礼（futsūrei）</text>
      <text x="95" y="220" text-anchor="middle" font-size="8.5" fill="#8A5A2E">~30°</text>
      <text x="95" y="238" text-anchor="middle" font-size="8.3">Salam standar</text>
      <text x="95" y="250" text-anchor="middle" font-size="8.3">menyambut/melayani</text>
    </g>

    <!-- Saikeirei 45 -->
    <g transform="translate(520,80)">
      <rect width="190" height="185" rx="14" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <line x1="30" y1="150" x2="160" y2="150" stroke="#C9B18C" stroke-width="2"/>
      <g transform="translate(95,150) rotate(-45)">
        <circle cx="0" cy="-70" r="12" fill="#8A2E3B"/>
        <line x1="0" y1="-58" x2="0" y2="-10" stroke="#8A2E3B" stroke-width="7" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="-16" y2="-20" stroke="#8A2E3B" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="-46" x2="16" y2="-20" stroke="#8A2E3B" stroke-width="5" stroke-linecap="round"/>
      </g>
      <line x1="88" y1="150" x2="82" y2="188" stroke="#8A2E3B" stroke-width="6" stroke-linecap="round"/>
      <line x1="102" y1="150" x2="108" y2="188" stroke="#8A2E3B" stroke-width="6" stroke-linecap="round"/>
      <path d="M95 150 L95 110 A40 40 0 0 1 67 125" fill="none" stroke="#9B6B2C" stroke-width="1.4" stroke-dasharray="2 2"/>
      <text x="45" y="128" font-size="9" fill="#8A2E3B" font-weight="700">45°</text>

      <text x="95" y="205" text-anchor="middle" font-weight="700" font-size="11">最敬礼（saikeirei）</text>
      <text x="95" y="220" text-anchor="middle" font-size="8.5" fill="#8A5A2E">~45°</text>
      <text x="95" y="238" text-anchor="middle" font-size="8.3">Permintaan maaf atau</text>
      <text x="95" y="250" text-anchor="middle" font-size="8.3">perpisahan penting</text>
    </g>
  </g>

  <text x="400" y="288" text-anchor="middle" font-size="9" fill="#5C1F28">Sikap dasar: luruskan punggung, tarik perut, lemaskan bahu, senyum alami</text>
</svg>
