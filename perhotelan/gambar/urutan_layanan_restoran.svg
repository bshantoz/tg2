<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#5C1F28">Urutan Layanan Restoran</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">レストランサービスの流れ</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <g font-size="9.2" fill="#2E2620">
    <!-- Step 1 -->
    <g transform="translate(26,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <circle cx="70" cy="25" r="5" fill="#FFFFFF"/>
      <path d="M60 40 q0 -9 10 -9 q10 0 10 9" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.2">Sambut &amp;</text>
      <text x="70" y="78" text-anchor="middle" font-weight="700" font-size="10.2">Antar ke Meja</text>
      <text x="70" y="94" text-anchor="middle" font-size="8.5" fill="#8A5A2E">出迎え・席へ案内</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.7">sesuai reservasi</text>
    </g>
    <line x1="166" y1="155" x2="180" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 -->
    <g transform="translate(180,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <rect x="61" y="21" width="18" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
      <line x1="64" y1="27" x2="76" y2="27" stroke="#FFFFFF" stroke-width="1.3"/>
      <line x1="64" y1="32" x2="76" y2="32" stroke="#FFFFFF" stroke-width="1.3"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.2">Catat Pesanan +</text>
      <text x="70" y="78" text-anchor="middle" font-weight="700" font-size="10.2">Alergi</text>
      <text x="70" y="94" text-anchor="middle" font-size="8.5" fill="#8A5A2E">注文・アレルギー確認</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.7">ulangi konfirmasi</text>
    </g>
    <line x1="320" y1="155" x2="334" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 -->
    <g transform="translate(334,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <path d="M60 34 h20 M70 34 v-12 M62 34 q0 6 8 6 q8 0 8 -6" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.2">Sajikan Hidangan</text>
      <text x="70" y="81" text-anchor="middle" font-size="8.5" fill="#8A5A2E">配膳（はいぜん）</text>
      <text x="70" y="97" text-anchor="middle" font-size="7.7">minum dari kanan,</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.7">makanan dari kiri tamu</text>
    </g>
    <line x1="474" y1="155" x2="488" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 -->
    <g transform="translate(488,90)">
      <rect width="140" height="130" rx="13" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="70" cy="30" r="16" fill="#5C3A17"/>
      <circle cx="65" cy="30" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="76" cy="30" r="4" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="70" y="65" text-anchor="middle" font-weight="700" font-size="10.2">Bersihkan Piring</text>
      <text x="70" y="78" text-anchor="middle" font-weight="700" font-size="10.2">Kosong</text>
      <text x="70" y="94" text-anchor="middle" font-size="8.5" fill="#8A5A2E">下げ膳</text>
      <text x="70" y="108" text-anchor="middle" font-size="7.7">sigap, tak ganggu tamu</text>
    </g>
    <line x1="628" y1="155" x2="642" y2="155" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 5 -->
    <g transform="translate(642,90)">
      <rect width="134" height="130" rx="13" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="67" cy="30" r="16" fill="#8A2E3B"/>
      <circle cx="60" cy="26" r="4.5" fill="#FFFFFF"/>
      <path d="M52 40 q0 -8 8 -8 q8 0 8 8" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
      <path d="M72 24 q6 0 6 6" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <text x="67" y="65" text-anchor="middle" font-weight="700" font-size="10.2">Antar Tamu</text>
      <text x="67" y="78" text-anchor="middle" font-weight="700" font-size="10.2">Keluar</text>
      <text x="67" y="94" text-anchor="middle" font-size="8.5" fill="#8A5A2E">お見送り</text>
      <text x="67" y="108" text-anchor="middle" font-size="7.7">ucapan terima kasih</text>
    </g>
  </g>

  <text x="400" y="270" text-anchor="middle" font-size="9" fill="#5C1F28">Perlu paham tata cara washoku (和食) &amp; yōshoku (洋食) untuk membantu tamu asing</text>
</svg>
