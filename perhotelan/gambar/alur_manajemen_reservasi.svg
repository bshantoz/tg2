<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#5C1F28">Alur Manajemen Reservasi</text>
  <text x="400" y="56" text-anchor="middle" font-size="14" fill="#9B6B2C">予約管理（yoyaku kanri）</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <g font-size="10.5" fill="#2E2620">
    <!-- Step 1 -->
    <g transform="translate(30,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <path d="M74 34 q0 -10 8 -10 q8 0 8 10 q3 0 3 5 q0 4 -4 4 h-14 q-4 0 -4 -4 q0 -5 3 -5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="70" cy="26" r="1.6" fill="#FFFFFF"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Pertanyaan</text>
      <text x="82" y="82" text-anchor="middle" font-weight="700" font-size="11">Reservasi Masuk</text>
      <text x="82" y="98" text-anchor="middle" font-size="9.5" fill="#8A5A2E">予約問い合わせ</text>
      <text x="82" y="114" text-anchor="middle" font-size="8.5">Telepon / email / web</text>
    </g>
    <line x1="194" y1="160" x2="212" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 2 -->
    <g transform="translate(212,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <rect x="72" y="22" width="20" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M75 32 l4 4 l9 -10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Periksa Ketersediaan</text>
      <text x="82" y="82" text-anchor="middle" font-weight="700" font-size="11">Kamar</text>
      <text x="82" y="98" text-anchor="middle" font-size="9.5" fill="#8A5A2E">空室・満室の確認</text>
      <text x="82" y="114" text-anchor="middle" font-size="8.5">kūshitsu / manshitsu</text>
    </g>
    <line x1="376" y1="160" x2="394" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 3 -->
    <g transform="translate(394,95)">
      <rect width="164" height="130" rx="14" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#5C3A17"/>
      <rect x="70" y="22" width="24" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="74" y1="28" x2="90" y2="28" stroke="#FFFFFF" stroke-width="1.6"/>
      <line x1="74" y1="34" x2="86" y2="34" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="82" y="68" text-anchor="middle" font-weight="700" font-size="11">Konfirmasi Data</text>
      <text x="82" y="82" text-anchor="middle" font-weight="700" font-size="11">Tamu</text>
      <text x="82" y="98" text-anchor="middle" font-size="9.5" fill="#8A5A2E">お客様情報の確認</text>
      <text x="82" y="114" text-anchor="middle" font-size="8.5">nama, tanggal, jumlah, alergi</text>
    </g>
    <line x1="558" y1="160" x2="576" y2="160" stroke="#9B6B2C" stroke-width="3" marker-end="url(#ap)"/>

    <!-- Step 4 -->
    <g transform="translate(576,95)">
      <rect width="194" height="130" rx="14" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="82" cy="32" r="17" fill="#8A2E3B"/>
      <path d="M74 32 l6 6 l12 -14" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="97" y="68" text-anchor="middle" font-weight="700" font-size="11">Konfirmasi / Batal</text>
      <text x="97" y="84" text-anchor="middle" font-size="9.5" fill="#8A5A2E">予約確定・キャンセル</text>
      <text x="97" y="102" text-anchor="middle" font-size="8.3">Waspada: overbooking,</text>
      <text x="97" y="114" text-anchor="middle" font-size="8.3">double booking, no-show</text>
    </g>
  </g>

  <text x="400" y="270" text-anchor="middle" font-size="9.5" fill="#5C1F28">Dikelola lewat PMS (Property Management System)</text>
</svg>
