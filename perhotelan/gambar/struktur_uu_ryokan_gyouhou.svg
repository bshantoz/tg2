<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#5C1F28">Struktur Undang-Undang Usaha Penginapan</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">旅館業法（ryokan gyō hō）</text>

  <!-- center node -->
  <g>
    <rect x="320" y="62" width="160" height="46" rx="12" fill="#5C1F28"/>
    <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#F7F2EA">旅館業法</text>
    <text x="400" y="98" text-anchor="middle" font-size="9.5" fill="#F0DFC9">Ryokan Gyō Hō</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#9B6B2C" stroke-width="2.5" fill="none">
    <path d="M360 108 L130 150"/>
    <path d="M385 108 L290 150"/>
    <path d="M415 108 L510 150"/>
    <path d="M440 108 L670 150"/>
  </g>

  <g font-size="10" fill="#2E2620">
    <!-- box 1: izin usaha -->
    <g transform="translate(50,150)">
      <rect width="160" height="118" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="26" cy="24" r="15" fill="#5C3A17"/>
      <path d="M19 24 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="20" text-anchor="middle" font-weight="700" font-size="11">Izin Usaha</text>
      <text x="80" y="33" text-anchor="middle" font-size="9" fill="#8A5A2E">許可の取得</text>
      <text x="80" y="55" text-anchor="middle" font-size="8.7">Izin dari gubernur</text>
      <text x="80" y="67" text-anchor="middle" font-size="8.7">prefektur / kepala</text>
      <text x="80" y="79" text-anchor="middle" font-size="8.7">保健所（hokenjo）</text>
      <text x="80" y="100" text-anchor="middle" font-size="8.3" fill="#8A2E3B">Tanpa izin = 違法</text>
    </g>

    <!-- box 2: standar fasilitas -->
    <g transform="translate(220,150)">
      <rect width="150" height="118" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="25" cy="24" r="15" fill="#5C3A17"/>
      <rect x="17" y="17" width="16" height="14" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="17" y1="23" x2="33" y2="23" stroke="#FFFFFF" stroke-width="1.6"/>
      <text x="78" y="20" text-anchor="middle" font-weight="700" font-size="11">Standar Fasilitas</text>
      <text x="78" y="33" text-anchor="middle" font-size="9" fill="#8A5A2E">施設の基準</text>
      <text x="78" y="55" text-anchor="middle" font-size="8.7">Luas kamar, ventilasi</text>
      <text x="78" y="67" text-anchor="middle" font-size="8.7">（換気）, pencahayaan</text>
      <text x="78" y="79" text-anchor="middle" font-size="8.7">（採光）, toilet, wastafel</text>
    </g>

    <!-- box 3: klasifikasi usaha -->
    <g transform="translate(430,150)">
      <rect width="160" height="118" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="26" cy="24" r="15" fill="#5C3A17"/>
      <rect x="18" y="17" width="7" height="14" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <rect x="27" y="21" width="7" height="10" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="80" y="20" text-anchor="middle" font-weight="700" font-size="11">Klasifikasi Usaha</text>
      <text x="80" y="33" text-anchor="middle" font-size="9" fill="#8A5A2E">営業の分類</text>
      <text x="80" y="53" text-anchor="middle" font-size="8.3">旅館・ホテル営業</text>
      <text x="80" y="65" text-anchor="middle" font-size="8.3">簡易宿所営業</text>
      <text x="80" y="77" text-anchor="middle" font-size="8.3">下宿営業</text>
      <text x="80" y="99" text-anchor="middle" font-size="8" fill="#8A5A2E">(hotel/ryokan, simpel, kos)</text>
    </g>

    <!-- box 4: buku tamu -->
    <g transform="translate(610,150)">
      <rect width="140" height="118" rx="12" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="25" cy="24" r="15" fill="#5C3A17"/>
      <rect x="17" y="16" width="16" height="17" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="20" y1="21" x2="30" y2="21" stroke="#FFFFFF" stroke-width="1.4"/>
      <line x1="20" y1="25" x2="30" y2="25" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="70" y="20" text-anchor="middle" font-weight="700" font-size="11">Buku Tamu</text>
      <text x="70" y="33" text-anchor="middle" font-size="9" fill="#8A5A2E">宿泊者名簿</text>
      <text x="70" y="55" text-anchor="middle" font-size="8.5">Nama, alamat,</text>
      <text x="70" y="67" text-anchor="middle" font-size="8.5">pekerjaan, lama</text>
      <text x="70" y="79" text-anchor="middle" font-size="8.5">menginap; salinan</text>
      <text x="70" y="91" text-anchor="middle" font-size="8.5">paspor tamu asing</text>
    </g>
  </g>

  <text x="400" y="292" text-anchor="middle" font-size="9.5" fill="#5C1F28">Tujuan: menjaga keamanan &amp; kesehatan tamu yang menginap</text>
</svg>
