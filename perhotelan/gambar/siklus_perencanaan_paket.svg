<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="800" height="300" fill="#F7F2EA"/>
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#5C1F28">Siklus Perencanaan Paket</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#9B6B2C">企画業務（kikaku gyōmu）</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9B6B2C"/>
    </marker>
  </defs>

  <!-- circular arrows connecting 4 nodes at corners of a square -->
  <g stroke="#9B6B2C" stroke-width="3" fill="none">
    <path d="M225 100 Q400 60 575 100" marker-end="url(#ap)"/>
    <path d="M660 155 Q700 200 575 235" marker-end="url(#ap)"/>
    <path d="M400 240 Q220 240 225 200" marker-end="url(#ap)"/>
    <path d="M140 155 Q100 90 225 100" marker-end="url(#ap)"/>
  </g>

  <g font-size="9.7" fill="#2E2620">
    <!-- Node 1: Target pasar -->
    <g transform="translate(90,90)">
      <circle cx="55" cy="55" r="55" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="55" cy="34" r="14" fill="#5C3A17"/>
      <circle cx="55" cy="30" r="5" fill="#FFFFFF"/>
      <path d="M45 42 q0 -8 10 -8 q10 0 10 8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="55" y="70" text-anchor="middle" font-weight="700" font-size="10">Target Pasar</text>
      <text x="55" y="83" text-anchor="middle" font-size="8.3" fill="#8A5A2E">ターゲット設定</text>
      <text x="55" y="96" text-anchor="middle" font-size="7.5">asing, sehat, kelas atas</text>
    </g>

    <!-- Node 2: Riset pemasaran -->
    <g transform="translate(560,90)">
      <circle cx="55" cy="55" r="55" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="55" cy="34" r="14" fill="#5C3A17"/>
      <circle cx="51" cy="30" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <line x1="56" y1="35" x2="62" y2="41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="55" y="70" text-anchor="middle" font-weight="700" font-size="10">Riset Pemasaran</text>
      <text x="55" y="83" text-anchor="middle" font-size="8.3" fill="#8A5A2E">マーケティング</text>
      <text x="55" y="96" text-anchor="middle" font-size="7.5">analisis kebutuhan tamu</text>
    </g>

    <!-- Node 3: Proposal -->
    <g transform="translate(560,155)">
      <circle cx="55" cy="55" r="55" fill="#FFFFFF" stroke="#9B6B2C" stroke-width="3"/>
      <circle cx="55" cy="34" r="14" fill="#5C3A17"/>
      <rect x="49" y="27" width="12" height="14" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <line x1="51" y1="31" x2="59" y2="31" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="51" y1="35" x2="59" y2="35" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="55" y="70" text-anchor="middle" font-weight="700" font-size="10">Susun Proposal</text>
      <text x="55" y="83" text-anchor="middle" font-size="8.3" fill="#8A5A2E">企画提案の作成</text>
      <text x="55" y="96" text-anchor="middle" font-size="7.5">paket menginap/makan</text>
    </g>

    <!-- Node 4: Luncurkan & evaluasi -->
    <g transform="translate(90,155)">
      <circle cx="55" cy="55" r="55" fill="#FFFFFF" stroke="#8A2E3B" stroke-width="3"/>
      <circle cx="55" cy="34" r="14" fill="#8A2E3B"/>
      <path d="M48 40 l7 -14 l7 14 z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="55" y="70" text-anchor="middle" font-weight="700" font-size="10">Luncurkan &amp;</text>
      <text x="55" y="83" text-anchor="middle" font-weight="700" font-size="10">Evaluasi</text>
      <text x="55" y="97" text-anchor="middle" font-size="8.3" fill="#8A5A2E">実施・評価</text>
    </g>
  </g>

  <text x="400" y="170" text-anchor="middle" font-size="9" fill="#5C1F28">Termasuk：dynamic</text>
  <text x="400" y="182" text-anchor="middle" font-size="9" fill="#5C1F28">pricing &amp; revenue</text>
  <text x="400" y="194" text-anchor="middle" font-size="9" fill="#5C1F28">management</text>
  <text x="400" y="280" text-anchor="middle" font-size="9" fill="#5C1F28">Paket + transportasi wajib terdaftar sesuai 旅行業法（Undang-Undang Usaha Perjalanan）</text>
</svg>
